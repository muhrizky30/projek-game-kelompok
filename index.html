      el('div', { class: 'row-btns' }, el('button', { class: 'pbtn check focus', onclick: () => this.close() }, 'Lanjut Menjelajah ▶')));
    this.open('★ TERIMA KASIH, PENJAGA HELIOS ★', body);
  }
};

// ---------- Touch controls ----------
const Touch = {
  vec: { x: 0, y: 0 }, active: false,
  init() {
    const joy = $('#joy'), knob = $('#knob');
    let pid = null, cx = 0, cy = 0;
    const R = 40;
    const upd = e => { let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy); if (d > R) { dx = dx / d * R; dy = dy / d * R; } knob.style.transform = `translate(${dx}px,${dy}px)`; this.vec.x = dx / R; this.vec.y = dy / R; };
    joy.addEventListener('pointerdown', e => { pid = e.pointerId; const r = joy.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; joy.setPointerCapture(pid); upd(e); AudioMgr.init(); e.preventDefault(); });
    joy.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
    const end = e => { if (e.pointerId !== pid) return; pid = null; this.vec.x = 0; this.vec.y = 0; knob.style.transform = ''; };
    joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
    for (const b of $$('#touch .tb')) b.addEventListener('pointerdown', e => { e.preventDefault(); AudioMgr.init(); Game.action(b.dataset.k); });
  }
};

// ============================================================

const Game = {
  S: null, state: 'boot', settings: { textSpeed: 1, daySpeed: 1, touch: 0, tracker: true },
  t: 0, camX: 0, camY: 0, vw: 384, vh: 216, scale: 3, keys: {}, region: null, focus: null, banner: null, queue: [], fade: 0, fadeDir: 0, fadeCb: null,
  overlayKind: null, touchUI: false, queueEnding: false,

  init() {
    Font.init(); Art.init(); World.gen(); World.prepare(); this.bucket();
    Save.loadSettings();
    this.canvas = $('#game'); this.ctx = this.canvas.getContext('2d');
    this.lightC = makeCanvas(10, 10);
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 200));
    this.resize();
    this.bindInput();
    Touch.init();
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state !== 'title') Save.save(); });
    window.addEventListener('beforeunload', () => { if (this.S && this.state !== 'title') Save.save(); });
    this.S = newState('Ari'); World.applyFlags({});
    this.toTitle();
    this.last = performance.now();
    requestAnimationFrame(ts => this.loop(ts));
  },
  bucket() {
    this.buckets = {};
    for (const o of World.objects) { const k = Math.floor(o.tx / 8) + ',' + Math.floor(o.ty / 8); (this.buckets[k] = this.buckets[k] || []).push(o); }
  },
  objsIn(x0, y0, x1, y1) {
    const out = [];
    for (let cy = Math.floor(y0 / 8); cy <= Math.floor(y1 / 8); cy++) for (let cx = Math.floor(x0 / 8); cx <= Math.floor(x1 / 8); cx++) { const b = this.buckets[cx + ',' + cy]; if (b) for (const o of b) out.push(o); }
    return out;
  },
  resize() {
    const W = window.innerWidth, H = window.innerHeight;
    const mn = Math.min(W, H);
    const s = Math.max(1, Math.floor(mn / (isTouch() && mn < 600 ? 175 : 200)));
    this.scale = s;
    this.vw = Math.ceil(W / s); this.vh = Math.ceil(H / s);
    this.canvas.width = this.vw; this.canvas.height = this.vh;
    this.canvas.style.width = (this.vw * s) + 'px'; this.canvas.style.height = (this.vh * s) + 'px';
    this.ctx.imageSmoothingEnabled = false;
    this.lightC.width = this.vw; this.lightC.height = this.vh;
    document.documentElement.style.setProperty('--px', s + 'px');

  },
  updateTouchUI() {
    const m = this.settings.touch || 0;
    this.touchUI = m === 1 || (m === 0 && isTouch());
    $('#touch').classList.toggle('hidden', !(this.touchUI && this.state === 'play'));
  },

  // ---------------- input ----------------
  bindInput() {
    window.addEventListener('keydown', e => {
      const k = e.key;
      AudioMgr.init();
      if (k === 'Escape' && UI.closeModal()) { e.preventDefault(); return; }
      if ($('.modal')) return;
      const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT');
      if (this.state === 'ide') { if (k === 'Escape') { if (typing) e.target.blur(); else if (IDE.open_) IDE.close(); else if (FlowEd.open_) FlowEd.close(); } return; }
      if (this.state === 'menu') {
        if (k === 'Escape') { UI.close(); e.preventDefault(); return; }
        if (!typing && UI.isOpen() && ((k === 'i' || k === 'I') && this.overlayName === 'inv' || (k === 'j' || k === 'J') && this.overlayName === 'journal' || (k === 'm' || k === 'M') && this.overlayName === 'map')) { UI.close(); e.preventDefault(); }
        return;
      }
      if (typing) return;
      if (this.state === 'cutscene') { if (k === 'Escape') this.endCutscene(); else if (k === ' ' || k === 'Enter' || k === 'e' || k === 'E') this.cutNext(); e.preventDefault(); return; }
      if (this.state !== 'play') return;
      this.keys[k.toLowerCase()] = true;
      if (Dialogue.active) {
        if (k === 'e' || k === 'E' || k === ' ' || k === 'Enter') { Dialogue.advance(); e.preventDefault(); }
        if (k === 'ArrowUp' || k === 'w' || k === 'W') Dialogue.move(-1);
        if (k === 'ArrowDown' || k === 's' || k === 'S') Dialogue.move(1);
        return;
      }
      switch (k) {
        case 'e': case 'E': case ' ': case 'Enter': this.action('interact'); e.preventDefault(); break;
        case 'i': case 'I': this.action('inv'); break;
        case 'j': case 'J': this.action('journal'); break;
        case 'm': case 'M': this.action('map'); break;
        case 'h': case 'H': this.action('nova'); break;
        case 'Escape': this.action('pause'); break;
      }
      if (k.startsWith('Arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    this.canvas.addEventListener('pointerdown', e => {
      AudioMgr.init();
      const r = this.canvas.getBoundingClientRect();
      const px = (e.clientX - r.left) / this.scale, py = (e.clientY - r.top) / this.scale;
      if (this.state === 'cutscene') { this.cutNext(); return; }
      if (this.state === 'play' && Dialogue.active) { Dialogue.click(px, py, this.vw, this.vh); return; }
      if (this.state === 'play' && !this.touchUI) {
        // click on HUD tracker opens journal
        if (px > this.vw - 130 && py > 32 && py < 80 && Quests.tracked()) this.action('journal');
      }
    });
  },
  action(k) {
    if (this.state !== 'play') return;
    if (k === 'interact') { if (Dialogue.active) Dialogue.advance(); else if (this.focus) this.interact(this.focus); return; }
    if (Dialogue.active) return;
    if (k === 'inv') { this.overlayName = 'inv'; UI.inventory(); }
    if (k === 'journal') { this.overlayName = 'journal'; UI.journal(); }
    if (k === 'map') { this.overlayName = 'map'; UI.map(); }
    if (k === 'pause') { this.overlayName = 'pause'; UI.pause(); }
    if (k === 'nova') { const q = Quests.tracked(); Nova.say(q ? 'Tujuan: ' + q.text + '. Ikuti panah kuning!' : 'Tidak ada tujuan aktif. Ayo jelajahi Verdantia dan bicara dengan penduduk!', 5); }
  },
  openOverlay(kind) { if (this.state !== 'ide' && this.state !== 'menu') this.prevState = this.state; this.state = kind === 'ide' ? 'ide' : 'menu'; this.keys = {}; this.updateTouchUI(); },
  closeOverlay() { this.state = this.prevState || 'play'; this.overlayName = null; this.keys = {}; this.updateTouchUI(); if (this.state === 'play') AudioMgr.setMood(REGIONS[this.region] ? REGIONS[this.region].mood : 'town', this.isNight()); },

  isNight() { const h = this.S.time / 60; return h >= 19.5 || h < 5.5; },

  // ---------------- interactions ----------------
  findFocus() {
    const f = Player.front(9);
    let best = null, bd = 16;
    for (const n of NPCs.list) {
      if (!n.visible()) continue;
      const d = dist(f.x, f.y, n.x, n.y - 6);
      if (d < bd) { bd = d; best = { kind: 'npc', n, x: n.x, y: n.y - 8, label: 'Bicara: ' + n.name }; }
    }
    const tx = Math.floor(Player.x / TILE), ty = Math.floor(Player.y / TILE);
    for (const o of this.objsIn(tx - 3, ty - 3, tx + 3, ty + 4)) {
      if (!World.objVisible(o)) continue;
      let rx, ry, rw, rh, label = o.label;
      if (o.type === 'building') { if (o.doorTx === undefined) continue; rx = o.doorTx * TILE; ry = o.doorTy * TILE - 6; rw = TILE; rh = 8; label = 'Pintu: ' + (o.name || 'Rumah'); }
      else if (o.act || o.gate || o.type === 'helios' || o.type === 'roots') { rx = o.tx * TILE; ry = o.ty * TILE; rw = o.fw * TILE; rh = o.fh * TILE; }
      else continue;
      if (o.act === 'terminal' && !label) label = 'Terminal';
      if (!label) label = { crystal: 'Ambil Kristal', plot: 'Petak Kebun', sign: 'Baca', station: 'Naik Kereta', storage: 'Periksa', mail: 'Kotak Surat' }[o.act] || 'Periksa';
      const cx = clamp(f.x, rx, rx + rw), cy = clamp(f.y, ry, ry + rh);
      const d = dist(f.x, f.y, cx, cy);
      if (d < bd) { bd = d; best = { kind: 'obj', o, x: rx + rw / 2, y: ry + Math.min(rh, 16), label }; }
    }
    return best;
  },
  interact(it) {
    if (it.kind === 'npc') return this.talk(it.n);
    const o = it.o, S = this.S, F = S.flags;
    const say = (lines, cb) => Dialogue.start(Array.isArray(lines) ? lines : [lines], cb);
    if (o.type === 'building') {
      if (o.doorAct === 'home') return say({ who: 'nova', text: 'Rumahmu. Mau tidur sampai pagi? (Game akan tersimpan.)', choices: [{ t: 'Tidur', fn: () => this.sleep() }, { t: 'Nanti saja' }] });
      if (o.doorAct === 'library') return say([{ who: 'bima', text: 'Perpustakaan Solaria. Semua catatan Python yang kamu temukan tersimpan di Codebook-mu.' }], () => UI.codebook());
      if (o.doorAct === 'shop_luma') return UI.shop('luma');
      if (o.doorAct === 'greenhouse') return say(F.greenhouse ? 'Greenhouse terang benderang dan hangat. Tanaman langka tumbuh subur.' : Inventory.count('greenhouse_key') ? 'Kamu membuka pintu greenhouse. Gelap di dalam... sistemnya perlu diprogram lewat terminal di samping.' : 'Pintu greenhouse terkunci. Mira bilang kuncinya dipegang Taro.');
      return say((o.name || 'Rumah') + '. Pintunya tertutup rapat.');
    }
    if (o.gate || o.type === 'roots') {
      if (World.gateOpen(o)) return say('Jalannya sudah terbuka.');
      const need = { solar: 'Gerbang energi ini mati. Dayanya berasal dari panel surya kota (quest Solar Awakening).', robot: 'Gerbang ladang terkunci. Taro menguncinya sejak robot-robot pertanian mogok.', forest: 'Akar liar menutup jalan. Mungkin akan mundur jika hutan ini pulih.', circuit: 'Pintu tersegel energi kuno. Butuh energi dari Sky Garden untuk membukanya.' }[o.gate];
      return say({ who: 'nova', text: need || 'Terkunci.' });

    switch (o.act) {
      case 'terminal': return this.useTerminal(o);
      case 'archive': return this.useArchive(o);
      case 'lore': Progress.unlockArchive([o.lore]); return say([{ who: 'sys', text: 'LOG HELIOS-1 ditemukan dan disalin ke Terminal Archive-mu.' }], () => UI.archive());
      case 'sandbox': return say({ who: 'nova', text: 'Free Programming Mode! Mau eksperimen dengan apa?', choices: [{ t: 'Blok Python', fn: () => this.openSandbox() }, { t: 'Flowchart', fn: () => this.openFlowSandbox() }, { t: 'Batal' }] });
      case 'station': return UI.map(o.station);
      case 'storage':
        if (Quests.active('q_robot') && !Inventory.count('copper_wire') && !S.solved.p_robot) { Inventory.add('copper_wire', 1); return say('Di antara baut dan per, kamu menemukan gulungan Copper Wire!'); }
        return say('Kotak penyimpanan Elio. Isinya baut, per, dan satu kaus kaki misterius.');
      case 'crystal': {
        S.collected[o.id] = true; Inventory.add('solar_crystal', 1); AudioMgr.sfx('sparkle'); Particles.emit('sparkle', o.bx, o.by - 8, 20);
        if (!Quests.st('s_crystals')) Quests.start('s_crystals');
        Progress.bump('crystals'); Progress.checkAch();
        return say({ who: 'nova', text: `Solar Crystal! (${S.counters.crystals}/6) Kristal ini menyimpan cahaya matahari dari masa lalu.` });
      }
      case 'gmush':
        if (!this.isNight()) return say({ who: 'nova', text: 'Jamur ini istimewa, tapi baru bersinar dan bisa dipetik saat malam.' });
        S.collected[o.id] = true; Inventory.add('glow_mushroom', 1); Particles.emit('sparkle', o.bx, o.by - 6, 14);
        if (!Quests.st('s_mushroom')) Quests.start('s_mushroom');
        Progress.bump('gmush');
        return say({ who: 'nova', text: `Jamur bercahaya istimewa! (${S.counters.gmush}/5)` });
      case 'drone': {
        const o2 = Quests.cur('q_drone');
        if (o2 && o2.t === 'find') { S.flags.found_drone = true; Quests.notify('find', 'drone'); return say([{ who: 'nova', text: 'Ketemu! Ini drone Finn. Programnya kosong, makanya dia tersesat.' }, { who: 'nova', text: 'Ayo program dia supaya tahu jalan pulang.' }], () => this.useTerminal(Object.assign({}, o, { puzzles: ['p_drone'] }))); }
        if (o2 && o2.t === 'puzzle') return this.useTerminal(Object.assign({}, o, { puzzles: ['p_drone'] }));
        return say('Sebuah drone kecil tersangkut di semak. Mungkin milik seseorang di kota?');
      }
      case 'telescope':
        if (!this.isNight()) return say({ who: 'nova', text: 'Teleskop kuno. Langit masih terlalu terang... kembali saat malam, yuk.' });
        if (!Quests.st('s_stars')) Quests.start('s_stars');
        return this.useTerminal(Object.assign({}, o, { puzzles: ['p_stars'] }));

  },
  talk(n) {
    const S = this.S, d = n.def;
    n.talking = true; n.faceTo(Player.x, Player.y);
    const first = !S.friends[n.id];
    if (first) { S.friends[n.id] = true; Progress.bump('friends'); Progress.checkAch(); }
    const r = Quests.talkTo(n.id);
    let lines = [];
    const W = t => ({ who: n.id, text: t });
    const isTalkObj = r && r.kind === 'talk';
    if (first && d.intro && !isTalkObj) lines = d.intro.map(W);
    let after = null;
    if (r) { lines = lines.concat(r.lines); after = r.after; }
    else if (n.id === 'unit7') {
      const st = Quests.st('s_unit7');
      if (!st) { if (!first) lines = d.intro.map(W); after = () => { Quests.start('s_unit7'); this.useTerminal({ puzzles: ['p_unit7'], id: 'unit7' }); }; }
      else if (st.s === 'active') { lines = [W('BZZT. BANTU... PERBAIKI MEMORI...')]; after = () => this.useTerminal({ puzzles: ['p_unit7'], id: 'unit7' }); }
      else lines = d.after[0][1].map(W);
    }
    else if (!first) {
      let pool = null;
      for (const [f, ls] of d.after || []) if (S.flags[f]) { pool = ls; break; }
      if (this.isNight() && d.night && Math.random() < 0.6) pool = d.night;
      if (!pool || Math.random() < 0.35) pool = d.lines;
      lines = [W(pick(Math.random, pool))];
    }
    if (d.shop && !(r && r.kind !== 'progress')) lines.push({ who: n.id, text: 'Mau lihat daganganku?', choices: [{ t: 'Lihat toko', fn: () => UI.shop(d.shop) }, { t: 'Lain kali' }] });
    if (!lines.length) lines = [W('...')];
    Dialogue.start(lines, after);
  },
  useTerminal(o) {
    const S = this.S, list = o.puzzles || [];
    const say = l => Dialogue.start(Array.isArray(l) ? l : [l]);
    for (const pid of list) for (const id in S.quests) {
      const ob = Quests.cur(id);
      if (ob && ob.t === 'puzzle' && ob.id === pid) {
        if (ob.consume) for (const k in ob.consume) if (Inventory.count(k) < ob.consume[k]) return say({ who: 'nova', text: `Kita butuh ${ob.consume[k]}× ${ITEMS[k].name} dulu.` });
        return this.openPuzzle(pid, false);
      }
    }
    // later objective in an active quest?
    for (const id in S.quests) {

  // ---------------- render ----------------

  lightSprite(r) {
    return Art.get('light' + r, () => {
      const c = makeCanvas(r * 2, r * 2), x = c.getContext('2d'), img = x.createImageData(r * 2, r * 2);

  drawLighting(ctx, camX, camY, vw, vh) {

    const ch = Art.chars.ari.down.idle[Math.floor(t * 10) % 40 < 2 ? 1 : 0];
    const aX = Math.round(cx + Math.min(150, vw * 0.3));
    ctx.drawImage(ch, aX - 12, gy + 30 - 42 + 8, 24, 42);
    ctx.drawImage(Art.nova(Math.floor(t * 2) % 2), aX + 16, Math.round(gy - 18 + Math.sin(t * 3) * 3), 28, 32);
    // title text
    const big = vw > 300 ? 3 : 2;
    const ty = Math.round(vh * 0.12);
    Font.draw(ctx, 'LOGIC FLOW', cx + big, ty + big, '#1d3b2a', { align: 'center', scale: big });
    Font.draw(ctx, 'LOGIC FLOW', cx, ty, '#f6c945', { align: 'center', scale: big, outline: '#1c2b24' });
    Font.draw(ctx, 'ADVENTURE', cx, ty + 11 * big, '#7fe0d0', { align: 'center', scale: big, outline: '#1c2b24' });
    Font.wrap('Explore the world. Discover the logic. Restore the future.', vw - 16).forEach((l, i) => Font.draw(ctx, l, cx, ty + 22 * big + 2 + i * 11, '#fff6e0', { align: 'center', outline: '#1c2b24' }));
    if (Math.random() < 0.1) Particles.emit('mote', Math.random() * vw, Math.random() * vh);
    Particles.update(1 / 60); Particles.draw(ctx, 0, 0, t);
    Font.draw(ctx, 'v1.0', vw - 4, vh - 11, 'rgba(255,255,255,0.6)', { align: 'right' });
  },
  cutscene(ctx, vw, vh, t, c) {
    if (!c) { ctx.fillStyle = '#101c16'; ctx.fillRect(0, 0, vw, vh); return; }
    const i = c.i;
    const dark = i === 2 ? clamp(c.t / 3, 0, 0.7) : i === 3 ? 0.5 : 0;
    const gy = this.backdrop(ctx, vw, vh, t, dark);
    const cx = vw / 2;
    if (i === 0) { for (let k = 0; k < 6; k++) ctx.drawImage(Art.tree(k % 2 ? 'round' : 'blossom', k % 3), Math.round(k * vw / 6), gy - 30); }
    if (i === 1 || i === 2) {
      const tower = Art.heliosTower(i === 1 || Math.floor(t * 8) % 5 === 0, Math.floor(t * 4));
      ctx.drawImage(tower, Math.round(cx - 28), gy + 8 - tower.height);
      for (const x of [cx - 120, cx + 90]) { ctx.drawImage(Art.prop('turbinepole'), Math.round(x), gy - 60); ctx.drawImage(Art.prop('blades', 0, i === 1 ? Math.floor(t * 10) % 8 : 2), Math.round(x - 18), gy - 82); }
      ctx.drawImage(Art.prop('solararray', i === 1 ? 1 : 0), Math.round(cx - 100), gy - 18); ctx.drawImage(Art.prop('solararray', i === 1 ? 1 : 0), Math.round(cx + 52), gy - 18);
      if (i === 1) for (let k = 0; k < 8; k++) { const q = ((t * 0.6 + k / 8) % 1); ctx.fillStyle = '#7df9ff'; ctx.fillRect(Math.round(lerp(cx, k % 2 ? cx - 150 : cx + 150, q)), Math.round(gy - 90 + q * 60), 2, 2); }
    }
    if (i === 3) {
      ctx.drawImage(Art.chars.ari.up.idle[0], Math.round(cx - 12), gy - 16, 24, 42);
      ctx.drawImage(Art.nova(1), Math.round(cx + 16), Math.round(gy - 30 + Math.sin(t * 3) * 3), 28, 32);
      const glyphs = ['if', 'for', 'def', '==', 'print()', 'while', '[ ]', 'True'];
      glyphs.forEach((g, k) => Font.draw(ctx, g, Math.round(cx + Math.cos(t * 0.4 + k) * (90 + k * 6)), Math.round(vh * 0.45 + Math.sin(t * 0.5 + k * 1.3) * 30), '#7df9ff', { outline: '#1c2b24' }));
    }
    ctx.fillStyle = 'rgba(16,28,22,0.78)'; ctx.fillRect(0, vh - 58, vw, 58);
    const lines = Font.wrap(this.CUTTXT(c), Math.min(vw - 24, 340));
    lines.forEach((l, k) => Font.draw(ctx, l, cx, vh - 50 + k * 11, '#fff6e0', { align: 'center' }));
    Font.draw(ctx, (c.i + 1) + '/4  •  ' + (Game.touchUI ? 'ketuk untuk lanjut' : 'E / Enter: lanjut   ESC: lewati'), cx, vh - 12, '#a3b18a', { align: 'center' });
  },
  CUTTXT(c) { return Game.CUT[c.i].slice(0, Math.floor(c.shown)); }
};

window.addEventListener('load', () => {
  Game.init();
  $('#btn-new').onclick = () => Game.newGame();
  $('#btn-continue').onclick = () => Game.continueGame();
  $('#btn-settings').onclick = () => { AudioMgr.init(); Game.hideTitleMenu(); Game.prevState = 'title'; UI.settings(true); };
  $('#btn-credits').onclick = () => { AudioMgr.init(); Game.hideTitleMenu(); Game.prevState = 'title'; UI.credits(true); };
  $('#btn-skip').onclick = () => { if (Game.state === 'cutscene') Game.endCutscene(); };
  window.LFA = { Game, World, Player, NPCs, Quests, IDE, FlowEd, UI, PUZZLES, runProgram, genCode, flowToPy, validateFlow, Inventory, Dialogue, Save, Progress, blk, newBlock };
  window.LFA_QUESTS = QUESTS; window.LFA_ITEMS = ITEMS;
});

})();
</script>
