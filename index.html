:root { --cream: #f3e9d2; --cream2: #fff6e0; --paper: #e9dcc0; --sage: #a3b18a; --sage2: #c2cca6; --dark: #1f3a2c; --dark2: #2f4a3a; --ink: #22302a; --ol: #1c2b24; --yellow: #f6c945; --turq: #4fc1b0; --terra: #c8643b; --green: #43a85a; --px: 3px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #101c16; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: 'LFAPixel', monospace; font-size: 20px; color: var(--ink); }
#game { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#overlays { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#overlays > * { pointer-events: auto; }
.hidden { display: none !important; }
.muted { color: #6b7a6a; }
.small { font-size: 20px; opacity: .85; }
button, input, select { font-family: 'LFAPixel', monospace; font-size: 20px; }
input, select, textarea { -webkit-user-select: text; user-select: text; }

/* ---------- buttons ---------- */
.pbtn { background: var(--sage); color: var(--ink); border: 3px solid var(--ol); padding: 5px 12px 7px; cursor: pointer; box-shadow: inset -3px -4px 0 rgba(0,0,0,.18), inset 3px 3px 0 rgba(255,255,255,.35); line-height: 1.1; touch-action: manipulation; }
.pbtn:hover { filter: brightness(1.08); }
.pbtn:active { transform: translateY(2px); box-shadow: inset 3px 3px 0 rgba(0,0,0,.2); }
.pbtn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.pbtn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.pbtn.run { background: #5fc46f; } .pbtn.check { background: var(--yellow); } .pbtn.hint { background: #7fe0d0; } .pbtn.alt { background: #b9a6e8; } .pbtn.danger { background: #e98a6b; }
.pbtn.stop { background: #e98a6b; }
.pbtn.small { padding: 2px 8px 4px; } .pbtn.tiny { padding: 0 6px 2px; } .pbtn.wide { width: 100%; }
.pbtn.on { background: var(--yellow); }

/* ---------- title ---------- */
#title-menu { position: fixed; left: 50%; bottom: max(5vh, 18px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 8; width: min(280px, 80vw); }
#title-menu .pbtn { font-size: 20px; padding: 8px 12px 10px; }
#btn-skip { position: fixed; right: 12px; top: 12px; z-index: 9; }

/* ---------- panels ---------- */
.panel { position: fixed; inset: 0; background: rgba(16,28,22,.55); display: flex; align-items: center; justify-content: center; padding: 10px; }
.panel-box { width: min(780px, 96vw); max-height: 92vh; display: flex; flex-direction: column; background: var(--cream); border: 4px solid var(--ol); box-shadow: 0 0 0 4px var(--sage), 10px 10px 0 4px rgba(0,0,0,.35); }
.panel.wide .panel-box { width: min(980px, 98vw); }
.panel-title { background: var(--dark); color: var(--cream); display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; gap: 10px; border-bottom: 4px solid var(--ol); }
.panel-title span { color: var(--yellow); text-shadow: 2px 2px 0 var(--ol); }
.panel-body { padding: 12px; overflow: auto; color: var(--ink); line-height: 1.25; -webkit-user-select: text; user-select: text; }
.panel-h { background: var(--dark2); color: var(--cream); padding: 2px 8px; margin: 8px 0 4px; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.pause-stats { margin-bottom: 10px; }
.pause-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.tab { background: var(--paper); border: 3px solid var(--ol); padding: 2px 10px 4px; cursor: pointer; font-family: inherit; font-size: 20px; color: var(--ink); }
.tab.on { background: var(--yellow); }

/* ---------- BLOCKS ---------- */
.blk { --c: #3f86d8; position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; color: #fff; font-size: 20px; touch-action: none; cursor: grab; margin-top: -2px; }
.blk > .row { display: flex; align-items: center; gap: 6px; padding: 3px 9px 4px; white-space: nowrap; min-height: 30px; background: var(--c); border: 2px solid var(--ol); box-shadow: inset 0 3px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.2); position: relative; }
.blk .lbl { text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.k-stmt > .row::after, .k-hat > .row::after, .k-c > .foot::after, .k-c > .row::after { content: ''; position: absolute; left: 14px; bottom: -8px; width: 18px; height: 6px; background: var(--c); border: 2px solid var(--ol); border-top: none; z-index: 2; }
.k-c > .row::after { left: 32px; }
.k-stmt > .row::before, .k-cap > .row::before, .k-c > .row::before { content: ''; position: absolute; left: 14px; top: 0; width: 18px; height: 4px; background: rgba(0,0,0,.28); }
.k-hat > .row { border-radius: 16px 16px 0 0; padding-top: 7px; min-width: 120px; }
.k-hat { margin-top: 0; }
.k-cap > .row { border-radius: 0 0 8px 8px; }
.k-c > .mouth { position: relative; margin-top: -2px; margin-left: 0; border-left: 16px solid var(--c); padding: 6px 0 6px 0; min-height: 34px; box-shadow: -2px 0 0 0 var(--ol), inset 2px 0 0 0 var(--ol); display: flex; flex-direction: column; align-items: flex-start; }
.k-c > .mouth > .blk:first-child { margin-top: 2px; }
.k-c > .foot { height: 16px; width: 86px; background: var(--c); border: 2px solid var(--ol); margin-top: -2px; position: relative; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.mouth-empty { width: 64px; height: 24px; border: 2px dashed rgba(28,43,36,.35); margin: 0 6px; }
.k-rep > .row, .k-bool > .row { min-height: 26px; padding: 1px 11px 2px; box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.2); }
.k-rep > .row { border-radius: 13px; }
.k-bool > .row { clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 11px 100%, 0 50%); padding: 1px 16px 2px; border: none; background: linear-gradient(var(--ol), var(--ol)) padding-box; box-shadow: none; }
.k-bool > .row::before { content: ''; position: absolute; inset: 2px; background: var(--c); clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); z-index: -1; }
.k-bool > .row { z-index: 0; isolation: isolate; }
.k-rep, .k-bool { margin-top: 0; }
.slot { display: inline-flex; align-items: center; min-width: 30px; min-height: 24px; background: #fff; border: 2px solid var(--ol); border-radius: 11px; }
.slot.bool { background: rgba(28,43,36,.35); border-radius: 4px; }
.slot.filled { background: none; border: none; min-width: 0; }
.slot.hl { outline: 3px solid #ffe17a; box-shadow: 0 0 0 6px rgba(255,225,122,.55); }
.slot input.lit { border: none; background: transparent; color: var(--ink); width: auto; padding: 0 6px; outline: none; min-width: 26px; text-align: center; height: 22px; }
.slot.bool input.lit { color: #fff; }
.slot input.lit::placeholder { color: rgba(28,43,36,.35); }
.fld { background: rgba(255,255,255,.94); color: var(--ink); border: 2px solid var(--ol); padding: 0 4px; height: 26px; border-radius: 4px; outline: none; }
input.fld { text-align: center; min-width: 30px; }
select.fld { padding: 0 2px; max-width: 170px; }
.fld:disabled, .lit:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); }
.slot.bool input.lit:disabled { -webkit-text-fill-color: #fff; }
.pal-item .blk, .pal-item .blk * { cursor: grab; }
.ide-palette .blk input, .ide-palette .blk select, .ide-ghost input, .ide-ghost select { pointer-events: none; }
.blk.active > .row, .blk.active > .foot { outline: 3px solid #ffe17a; filter: brightness(1.18); }
.blk.err-blk > .row { outline: 3px solid #e0504a; animation: shake .4s; }
.blk.flash > .row { animation: flash .7s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes flash { 0%, 100% { filter: none; } 50% { filter: brightness(1.6); } }
.ide.running .ws-canvas .blk { cursor: default; }

/* ---------- FLOWCHART ---------- */

.fl-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px 8px; }

  // ====================== PROPS ======================
  tree(kind = 'round', v = 0) {
    return this.get(`tree_${kind}_${v}`, () => {
      const r = mulberry32(v * 13 + kind.length * 7 + 1);
      const sets = {
        round: [['#4caf62', '#3f8f4f', '#2f6f3f', '#86d07a'], ['#5fae55', '#4a9444', '#357236', '#9ccf6a'], ['#7fa64a', '#6a8f3a', '#4f6f2c', '#b4d27a']],
        blossom: [['#f2a7c3', '#e48aac', '#c06a8c', '#ffd1e2']],
        fruit: [['#4caf62', '#3f8f4f', '#2f6f3f', '#86d07a']],
        dead: [['#8a7a52', '#6f6040', '#54482f', '#a69668']],
        glow: [['#2f8f6f', '#25745a', '#1b5844', '#4fc1a0']]
      };
      const C = (sets[kind] || sets.round)[v % (sets[kind] || sets.round).length];
      if (kind === 'giant') {
        const pg = new PG(56, 72);
        const tr = ['#7a5236', '#5e3b26', '#946646'];
        pg.rect(20, 40, 16, 30, tr[0]); pg.rect(31, 40, 5, 30, tr[1]); pg.rect(21, 40, 3, 30, tr[2]);
        pg.rect(15, 64, 8, 6, tr[1]); pg.rect(33, 64, 9, 6, tr[1]); pg.rect(12, 68, 6, 3, tr[1]); pg.rect(38, 68, 6, 3, tr[1]);
        const cc = ['#2f8f5a', '#25744a', '#1b583a', '#4fbf7a'];
        for (const [cx, cy, rx, ry] of [[28, 24, 25, 20], [12, 32, 12, 10], [44, 32, 12, 10], [28, 10, 16, 10]]) pg.ellipse(cx, cy, rx, ry, (x, y, dx, dy) => dy < -0.45 && dx < 0.3 ? cc[3] : (dy > 0.45 || dx > 0.6) ? cc[2] : cc[0]);
        pg.noise(4, 2, 48, 40, [cc[1], cc[3]], 0.08, r);
        for (let i = 0; i < 5; i++) { const x = 21 + Math.floor(r() * 13), y = 46 + Math.floor(r() * 18); pg.rect(x, y, 3, 2, '#7df9ff'); pg.set(x + 1, y + 2, '#e9dcc0'); }
        pg.outline(OL);
        return pg.toCanvas();
      }
      if (kind === 'pine') {
        const pg = new PG(24, 40);
        pg.rect(10, 30, 4, 9, '#6b4a32');
        for (let i = 0; i < 4; i++) { const y = 4 + i * 7, w = 4 + i * 3; for (let j = 0; j < 9; j++) pg.hline(12 - Math.floor(w * j / 8), y + j, Math.floor(w * j / 8) * 2, j < 2 ? '#5fae7a' : (j > 6 ? '#24603f' : '#2f7a4f')); }
        pg.noise(2, 2, 20, 30, ['#3f9a66'], 0.06, r);
        pg.outline(OL);
        return pg.toCanvas();
      }
      const pg = new PG(34, 44);
      pg.rect(14, 28, 6, 15, '#7a4f32'); pg.rect(18, 28, 2, 15, '#5e3b26'); pg.rect(14, 28, 1, 15, '#94653f');
      pg.set(13, 42, '#5e3b26'); pg.set(20, 42, '#5e3b26');
      const blobs = kind === 'dead' ? [[17, 15, 11, 9], [9, 20, 6, 5], [25, 19, 6, 5]] : [[17, 16, 14, 12], [8, 21, 8, 7], [26, 21, 8, 7], [17, 8, 10, 7]];
      for (const [cx, cy, rx, ry] of blobs) pg.ellipse(cx, cy, rx, ry, (x, y, dx, dy) => dy < -0.45 && dx < 0.25 ? C[3] : (dy > 0.45 || dx > 0.6) ? C[2] : C[0]);
      pg.noise(2, 2, 30, 26, [C[1]], 0.12, r); pg.noise(2, 2, 30, 18, [C[3]], 0.04, r);
      if (kind === 'dead') { pg.line(17, 28, 10, 14, '#5e3b26'); pg.line(17, 28, 25, 12, '#5e3b26'); for (let i = 0; i < 40; i++) { const x = Math.floor(r() * 34), y = Math.floor(r() * 30); if (pg.get(x, y) !== null && pg.get(x, y) !== '#5e3b26' && r() < 0.5) pg.set(x, y, null); } }
      if (kind === 'blossom') pg.noise(3, 4, 28, 22, ['#ffffff', '#ffd1e2'], 0.06, r);
      if (kind === 'fruit') for (let i = 0; i < 7; i++) { const x = 5 + Math.floor(r() * 24), y = 6 + Math.floor(r() * 20); if (pg.get(x, y)) { pg.rect(x, y, 2, 2, '#f0913a'); pg.set(x, y, '#ffe17a'); } }
      pg.outline(OL);
      return pg.toCanvas();
    });
  },
  bush(v = 0) {
    return this.get('bush' + v, () => {
      const pg = new PG(18, 14), r = mulberry32(v + 40);
      const C = [['#4caf62', '#2f7f45', '#86d07a'], ['#5fae55', '#3f8040', '#9ccf6a'], ['#3f8f6f', '#2f6f55', '#6fcfa0']][v % 3];

  _blades(s, f) { // 8 rotation frames

      const a = a0 + k * Math.PI * 2 / 3;
      for (let t = 3; t < 22; t++) {
        const x = 24 + Math.cos(a) * t, y = 24 + Math.sin(a) * t;
        const w = t < 8 ? 1.6 : t < 16 ? 1.2 : 0.7;
        pg.ellipse(x, y, w, w, t > 18 ? '#e07f4f' : '#f6f3ea');

    }
    pg.ellipse(24, 24, 2.5, 2.5, '#c9c2b0');
    pg.outline(OL); return pg.toCanvas();

  // ====================== BUILDINGS ======================
  building(spec) {
    return this.get('bld_' + JSON.stringify(spec), () => {
      const W = spec.w * 16, wallH = spec.wallH || 24, H = spec.d * 16 + (spec.up || 14);
      const roofH = H - wallH;
      const pg = new PG(W, H), r = mulberry32(W * 7 + H);
      const wall = spec.wall || '#f3e9d2', wall2 = shade(wall, -0.12), roof = spec.roof || '#c8643b';
      const windows = [];
      // wall
      pg.rect(1, roofH, W - 2, wallH - 1, wall);
      pg.rect(1, H - 4, W - 2, 3, '#8c8f86'); pg.hline(1, H - 4, W - 2, '#b5b6a8');
      for (let x = 1; x < W - 1; x += 2) pg.set(x, roofH + 1, wall2);
      pg.vline(1, roofH, wallH - 4, '#b07a4f'); pg.vline(W - 2, roofH, wallH - 4, '#8a5a3b');
      if (spec.wood) for (let y = roofH + 3; y < H - 4; y += 4) pg.hline(2, y, W - 4, wall2);
      // roof
      const type = spec.type || 'solar';
      if (type === 'glass') {
        pg.rect(0, 2, W, roofH, 'rgba(159,232,255,0.55)');
        for (let x = 0; x < W; x += 8) pg.vline(x, 2, roofH, '#d8f3fa');
        for (let y = 2; y < roofH; y += 7) pg.hline(0, y, W, '#d8f3fa');
        const lit = spec.lit;
        for (let i = 0; i < W / 6; i++) { const x = 3 + Math.floor(r() * (W - 6)), y = 6 + Math.floor(r() * (roofH - 8)); pg.ellipse(x, y, 2.5, 2, lit ? pick(r, ['#4caf62', '#86d07a', '#5fae55']) : pick(r, ['#6f6a4a', '#5a5a40'])); if (lit && r() < 0.4) pg.set(x, y - 1, pick(r, ['#ff9ce6', '#ffe17a'])); }
        pg.hline(0, 1, W, '#6f7f86'); pg.hline(0, roofH, W, '#6f7f86');
        pg.rect(1, roofH, W - 2, wallH - 4, 'rgba(159,232,255,0.6)'); for (let x = 2; x < W; x += 8) pg.vline(x, roofH, wallH - 4, '#d8f3fa');
      } else if (type === 'dome') {
        pg.ellipse(W / 2, roofH, W / 2 - 1, roofH - 2, (x, y, dx, dy) => y > roofH ? null : (dy < -0.5 && dx < 0 ? '#d8f3fa' : 'rgba(159,232,255,0.8)'));
        for (let i = -2; i <= 2; i++) pg.line(W / 2, 3, W / 2 + i * W / 6, roofH, '#6f7f86');
        pg.hline(2, roofH, W - 4, '#6f7f86');
      } else {
        const eave = roofH;
        pg.rect(0, 3, W, eave - 3, roof); pg.hline(0, 3, W, shade(roof, 0.3)); pg.hline(0, 4, W, shade(roof, 0.15));
        pg.rect(0, eave - 3, W, 3, shade(roof, -0.3)); pg.hline(0, eave, W, '#3a2a20');
        if (type === 'green') {
          pg.noise(0, 4, W, eave - 7, ['#4caf62', '#5fae55', '#86d07a', '#3f8f4f'], 0.55, r);
          for (let i = 0; i < W / 10; i++) { const x = 4 + Math.floor(r() * (W - 8)), y = 6 + Math.floor(r() * (eave - 12)); pg.ellipse(x, y, 3, 2.5, '#4caf62'); pg.set(x - 1, y - 1, '#86d07a'); if (r() < 0.5) pg.set(x + 1, y, pick(r, ['#ff9ce6', '#ffe17a', '#ffffff'])); }
        } else if (type === 'solar') {
          const pw = Math.floor((W - 8) / 12);
          for (let i = 0; i < pw; i++) for (let j = 0; j < Math.max(1, Math.floor((eave - 10) / 9)); j++) {
            const x = 4 + i * 12 + Math.floor(((W - 8) - pw * 12) / 2), y = 6 + j * 9;
            pg.rect(x, y, 11, 8, '#284a6e'); pg.hline(x, y + 4, 11, '#3c6fa0'); pg.vline(x + 4, y, 8, '#3c6fa0'); pg.vline(x + 8, y, 8, '#3c6fa0'); pg.hline(x, y, 11, '#79a9d8'); pg.set(x + 1, y + 1, '#ffffff');
          }
          for (let x = 2; x < W - 2; x += 5) if (r() < 0.6) { pg.set(x, eave - 3, '#4caf62'); pg.set(x, eave - 2, '#3f8f4f'); }
        } else {
          for (let y = 7; y < eave - 3; y += 3) for (let x = (y % 2) * 3; x < W; x += 6) pg.hline(x, y, 4, shade(roof, -0.12));
        }
        if (spec.chimney) { pg.rect(W - 14, 0, 6, 8, '#8c8f86'); pg.hline(W - 14, 0, 6, '#b5b6a8'); }
      }
      // windows
      const nWin = spec.windows !== undefined ? spec.windows : Math.max(1, Math.floor(spec.w * 0.8));
      const doorX = spec.door !== undefined ? spec.door * 16 + 3 : -100;
      const slots = [];
      for (let i = 0; i < spec.w; i++) if (Math.abs(i * 16 + 3 - doorX) > 8) slots.push(i);
      for (let k = 0; k < Math.min(nWin, slots.length); k++) {
        const i = slots[Math.round(k * (slots.length - 1) / Math.max(1, Math.min(nWin, slots.length) - 1))] ?? slots[0];
        const wx = i * 16 + 4, wy = roofH + 5;
        if (type === 'glass') continue;
        pg.rect(wx - 1, wy - 1, 10, 10, '#7a4f32'); pg.rect(wx, wy, 8, 8, '#9fd8ef'); pg.hline(wx, wy + 4, 8, '#7a4f32'); pg.vline(wx + 4, wy, 8, '#7a4f32'); pg.set(wx + 1, wy + 1, '#ffffff'); pg.set(wx + 5, wy + 1, '#d8f3fa');
        pg.rect(wx - 1, wy + 9, 10, 2, '#8a5a3b'); pg.set(wx, wy + 8, '#4caf62'); pg.set(wx + 3, wy + 8, '#ff9ce6'); pg.set(wx + 6, wy + 8, '#4caf62');
        windows.push({ x: wx, y: wy, w: 8, h: 8 });
      }
      // door
      if (spec.door !== undefined) {
        const dx = spec.door * 16 + 3, dw = 10, dh = Math.min(15, wallH - 6), dy = H - 4 - dh;
        pg.rect(dx - 1, dy - 1, dw + 2, dh + 1, '#5e3b26'); pg.rect(dx, dy, dw, dh, spec.doorCol || '#8a5a3b');
        pg.vline(dx + 5, dy, dh, shade(spec.doorCol || '#8a5a3b', -0.2)); pg.set(dx + 7, dy + 8, '#f6c945');
        if (spec.garage) { pg.rect(dx - 6, dy - 1, dw + 12, dh + 1, '#5e6d72'); for (let y = dy; y < dy + dh; y += 3) pg.hline(dx - 5, y, dw + 10, '#76868c'); }
        windows.push({ x: dx + 2, y: dy + 2, w: 6, h: 4, door: true });
      }
      if (spec.awning) {
        const ay = roofH + 1, ax = Math.max(2, doorX - 10), aw = Math.min(W - 4 - ax, 30);
        for (let x = ax; x < ax + aw; x++) for (let y = ay; y < ay + 5; y++) pg.set(x, y, Math.floor((x - ax) / 3) % 2 ? spec.awning : '#fff1c9');
        for (let x = ax; x < ax + aw; x += 3) pg.set(x + 1, ay + 5, spec.awning);
      }
      if (spec.sign) {
        const sx = Math.round(W / 2) - 9, sy = roofH - 2;
        pg.rect(sx, sy, 18, 9, '#3a2a20'); pg.rect(sx + 1, sy + 1, 16, 7, '#f3e9d2');
        const ic = spec.sign;
        if (ic === 'gear') { pg.ellipse(sx + 9, sy + 4.5, 3, 3, '#6f7f86'); pg.set(sx + 9, sy + 4, '#f3e9d2'); pg.set(sx + 5, sy + 4, '#6f7f86'); pg.set(sx + 13, sy + 4, '#6f7f86'); }
        if (ic === 'book') { pg.rect(sx + 4, sy + 2, 4, 5, '#c8643b'); pg.rect(sx + 9, sy + 2, 4, 5, '#3c6fa0'); }
        if (ic === 'leaf') { pg.ellipse(sx + 9, sy + 4, 4, 2.5, '#4caf62'); pg.hline(sx + 6, sy + 4, 6, '#2f6f3f'); }
        if (ic === 'sun') { pg.ellipse(sx + 9, sy + 4.5, 2.5, 2.5, '#f6c945'); pg.set(sx + 5, sy + 4, '#f6c945'); pg.set(sx + 13, sy + 4, '#f6c945'); }

        default: pg.rect(3, 3, 6, 6, '#c2cca6');

  cloud(v) {

// ---- 03_world.js ----
// ============================================================
//  03 WORLD MANAGER — tilemap generation (6 regions), objects,
//  progression gates, chunked ground rendering, collision, lights.
// ============================================================
const T = { GRASS: 0, FLOWERS: 1, FOREST: 2, MOSS: 3, PATH: 4, PLAZA: 5, DIRT: 6, SOIL: 7, SAND: 8, WATER: 9, DEEP: 10, CANAL: 11, BRIDGEH: 12, BRIDGEV: 13, DECK: 14, ROOTB: 15, VOID: 16, EBRIDGE: 17, METAL: 18, CIRCUIT: 19, STONE: 20, HEDGE: 21, WALL: 22, RAIL: 23, AQUA: 24, DRAWB: 25 };
const SOLID_T = new Set([T.WATER, T.DEEP, T.CANAL, T.VOID, T.HEDGE, T.WALL, T.RAIL, T.AQUA]);
const ANIM_T = new Set([T.WATER, T.DEEP, T.CANAL, T.AQUA, T.EBRIDGE, T.VOID, T.DRAWB]);
const LANDLIKE = t => !(t === T.WATER || t === T.DEEP || t === T.CANAL || t === T.AQUA || t === T.VOID || t === T.EBRIDGE || t === T.DRAWB);
const SOFT_EDGE = new Set([T.GRASS, T.FLOWERS, T.FOREST, T.MOSS]);

const REGIONS = {
  town: { name: 'Solaria Town', color: '#f6c945', mood: 'town' },
  forest: { name: 'Whispering Forest', color: '#4fc1a0', mood: 'forest' },
  farm: { name: 'Sunflower Farmlands', color: '#f0913a', mood: 'farm' },
  aqua: { name: 'Aqua District', color: '#4fa8e0', mood: 'aqua' },
  sky: { name: 'Sky Garden', color: '#a9e0f0', mood: 'sky' },
  circuit: { name: 'The Old Circuit', color: '#8a6bd1', mood: 'circuit' }
};

const World = {
  W: 128, H: 96, tiles: null, objects: [], occ: null, chunks: {}, chunkDirty: true, flagsKey: '',
  byId: {},
  regionAt(tx, ty) {
    if (tx < 34) return 'forest';
    if (tx >= 94) return ty < 62 ? 'farm' : 'circuit';
    if (ty < 26) return 'sky';
    return ty < 62 ? 'town' : 'aqua';
  },
  idx(x, y) { return y * this.W + x; },
  get(x, y) { if (x < 0 || y < 0 || x >= this.W || y >= this.H) return T.VOID; return this.tiles[y * this.W + x]; },
  set(x, y, t) { if (x >= 0 && y >= 0 && x < this.W && y < this.H) this.tiles[y * this.W + x] = t; },
  fill(x0, y0, x1, y1, t) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, t); },
  ell(cx, cy, rx, ry, t) { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) { const dx = (x - cx) / rx, dy = (y - cy) / ry; if (dx * dx + dy * dy <= 1) this.set(x, y, t); } },

  // ---------------- generation ----------------
  gen() {
    const W = this.W, H = this.H;
    this.tiles = new Uint8Array(W * H);
    this.occ = new Uint8Array(W * H);     // object solid occupancy
    this.reserved = new Uint8Array(W * H); // keep-clear
    this.objects = []; this.byId = {};
    const rng = mulberry32(2189);
    this.rng = rng;
    this.genForest(rng); this.genSky(rng); this.genTown(rng); this.genFarm(rng); this.genAqua(rng); this.genCircuit(rng);
    this.scatter(rng);
    this.objects.sort((a, b) => a.by - b.by);
  },
  reserve(x0, y0, x1, y1) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x >= 0 && y >= 0 && x < this.W && y < this.H) this.reserved[y * this.W + x] = 1; },
  path(x0, y0, x1, y1, t = T.PATH, w = 2, bridge = null) {
    // L-shaped path, horizontal first. Water becomes `bridge` if given.
    const xa = Math.min(x0, x1), xb = Math.max(x0, x1), ya = Math.min(y0, y1), yb = Math.max(y0, y1);
    const put = (x, y) => { const tt = this.get(x, y); if (tt === T.WATER || tt === T.CANAL || tt === T.AQUA) { if (bridge !== null) this.set(x, y, bridge); } else if (tt !== T.HEDGE && tt !== T.WALL && tt !== T.ROOTB) this.set(x, y, t); };
    for (let x = xa; x <= xb; x++) for (let k = 0; k < w; k++) put(x, y0 + k);
    for (let y = ya; y <= yb; y++) for (let k = 0; k < w; k++) put(x1 + k, y);
  },
  add(type, tx, ty, o = {}) {
    const ob = Object.assign({ type, tx, ty, fw: 1, fh: 1, solid: true }, o);
    ob.id = o.id || (type + '_' + tx + '_' + ty);
    ob.bx = (tx + ob.fw / 2) * TILE;          // bottom-center x px
    ob.by = (ty + ob.fh) * TILE + (o.dy || 0); // bottom y px (sort key)
    ob.cx = ob.bx; ob.cy = (ty + ob.fh / 2) * TILE;
    if (ob.solid) for (let y = ty; y < ty + ob.fh; y++) for (let x = tx; x < tx + ob.fw; x++) if (x >= 0 && y >= 0 && x < this.W && y < this.H) this.occ[y * this.W + x] = 1;
    this.objects.push(ob); this.byId[ob.id] = ob;
    return ob;
  },
  free(tx, ty, fw = 1, fh = 1, pad = 0) {
    for (let y = ty - pad; y < ty + fh + pad; y++) for (let x = tx - pad; x < tx + fw + pad; x++) {
      if (x < 0 || y < 0 || x >= this.W || y >= this.H) return false;
      if (this.occ[y * this.W + x] || this.reserved[y * this.W + x]) return false;
    }
    for (let y = ty; y < ty + fh; y++) for (let x = tx; x < tx + fw; x++) { const t = this.get(x, y); if (!(t === T.GRASS || t === T.FLOWERS || t === T.FOREST || t === T.MOSS || t === T.STONE || t === T.SAND || t === T.METAL || t === T.CIRCUIT)) return false; }
    return true;
  },
  building(tx, ty, spec, o = {}) {
    const b = this.add('building', tx, ty, Object.assign({ fw: spec.w, fh: spec.d, spec }, o));
    if (spec.door !== undefined) { b.doorTx = tx + spec.door; b.doorTy = ty + spec.d; this.reserve(b.doorTx - 1, b.doorTy, b.doorTx + 1, b.doorTy + 1); }
    this.reserve(tx - 1, ty - 1, tx + spec.w, ty + spec.d);
    return b;
  },

  genForest(rng) {
    this.fill(0, 0, 33, 95, T.FOREST);
    this.riverX = y => Math.round(16 + 4 * Math.sin(y / 9) + 2 * Math.sin(y / 4.3));

    const B = T.ROOTB;
    this.path(24, 43, 33, 43, T.DIRT, 2, B);         // entry from town
    this.path(26, 10, 26, 43, T.DIRT, 2, B);         // north spine
    this.path(26, 43, 26, 86, T.DIRT, 2, B);         // south spine
    this.path(26, 86, 33, 86, T.DIRT, 2, B);         // to aqua roots
    this.path(27, 29, 30, 29, T.DIRT, 1, B);         // lab
    this.path(14, 12, 26, 12, T.DIRT, 1, B);         // west spur north (crosses river)
    this.path(4, 70, 26, 70, T.DIRT, 1, B);          // hidden archive spur
    this.path(4, 70, 4, 76, T.DIRT, 1, B);
    // clearings
    this.ell(22, 57, 4.5, 3, T.MOSS);
    this.ell(30, 29, 3.5, 2, T.MOSS);
    this.ell(28, 10, 4, 3, T.MOSS);
    this.ell(4, 77, 3, 3, T.MOSS);
    for (let y = 62; y <= 95; y++) this.set(34, y, T.HEDGE);
    this.set(34, 86, T.DIRT); this.set(34, 87, T.DIRT);
    // lab
    this.building(28, 24, { w: 6, d: 3, type: 'dome', wall: '#e9e4d6', door: 2, windows: 2, vines: true, up: 18 }, { id: 'lab', name: 'Lab Orin' });
    this.add('robot', 32, 29, { id: 't_curious', robot: 'curious', act: 'terminal', puzzles: ['p_curious'], label: 'Robot Penasaran', onFlag: 'curious' });
    this.add('robot', 23, 56, { id: 't_planter', robot: 'roots', act: 'terminal', puzzles: ['p_planter'], label: 'Robot ROOTS', onFlag: 'forest', hideFlag: 'forest' });

  },
  genSky() {

    this.fill(94, 0, 127, 25, T.GRASS); // farm north (overwritten by farm gen)
    // islands

    this.ell(84, 12, 8, 6, T.GRASS);
    this.ell(70, 20, 4.5, 3, T.GRASS);
    this.fill(43, 9, 49, 13, T.STONE);
    this.path(44, 13, 49, 17, T.STONE, 2);
    this.fill(62, 6, 70, 9, T.STONE);
    // energy bridges

    // buildings on islands

    this.add('solararray', 62, 4, { id: 'sky_solar', fw: 3, fh: 1 });

  genTown(rng) {

  // ---------------- flags → world state ----------------
  applyFlags(F) {
    const key = JSON.stringify(F);
    if (key === this.flagsKey) return;
    this.flagsKey = key;
    this.F = F;
    this.chunks = {}; // invalidate
  },
  tileSolid(x, y) {
    const t = this.get(x, y);
    if (t === T.EBRIDGE) return !(this.F && this.F.skybridge);
    if (t === T.DRAWB) return !(this.F && this.F.wind);
    if (SOLID_T.has(t)) return true;
    return false;
  },
  isBlocked(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.W || ty >= this.H) return true;
    if (this.tileSolid(tx, ty)) return true;
    if (this.occ[ty * this.W + tx]) {
      // dynamic gates
      for (const o of this.dynObjs || []) if (tx >= o.tx && tx < o.tx + o.fw && ty >= o.ty && ty < o.ty + o.fh) return o.gate ? !this.gateOpen(o) : !(this.F && this.F[o.hideFlag]);
      return true;
    }
    return false;
  },
  gateOpen(o) { return !!(this.F && this.F[o.gate]); },
  prepare() { this.dynObjs = this.objects.filter(o => o.solid && (o.gate || o.hideFlag)); },
  rectBlocked(x, y, w, h) {
    const x0 = Math.floor(x / TILE), y0 = Math.floor(y / TILE), x1 = Math.floor((x + w - 0.01) / TILE), y1 = Math.floor((y + h - 0.01) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.isBlocked(tx, ty)) return true;
    return false;
  },

  // ---------------- ground rendering ----------------
  tileImg(t, x, y, frame) {
    const F = this.F || {};
    const v = Math.floor(hash2(x, y, 11) * 4);
    switch (t) {
      case T.GRASS: return Art.tile('grass', v);
      case T.FLOWERS: return Art.tile('flowers', v);
      case T.FOREST: return Art.tile(F.forest || y < 45 || y > 75 ? 'forest' : (hash2(x, y, 3) < 0.5 ? 'forest' : 'dirt'), v);
      case T.MOSS: return Art.tile('moss', v);
      case T.PATH: return Art.tile('path', v);
      case T.PLAZA: return Art.tile('plaza', v % 2);
      case T.DIRT: return Art.tile('dirt', v);
      case T.SOIL: return Art.tile(F.irrigation ? 'soilwet' : 'soil', v);
      case T.SAND: return Art.tile('sand', v);
      case T.WATER: case T.DRAWB: return Art.tile('water', frame);
      case T.DEEP: return Art.tile('deep', frame);
      case T.CANAL: return F.irrigation ? Art.tile('water', frame) : Art.tile('canaldry', v);
      case T.AQUA: return F.aqua ? Art.tile('water', frame) : Art.tile('dirty', frame);
      case T.BRIDGEH: return Art.tile('bridgeh');
      case T.BRIDGEV: return Art.tile('bridgev');
      case T.DECK: return Art.tile('deck', v);
      case T.ROOTB: return Art.tile('rootbridge');

  },
  buildChunk(cx, cy) {
    const CS = 16, c = makeCanvas(CS * TILE, CS * TILE), ctx = c.getContext('2d');

      const x = cx * CS + i, y = cy * CS + j;

        ctx.fillStyle = 'rgba(216,243,250,0.7)';

        if (LANDLIKE(this.get(x - 1, y))) ctx.fillRect(px, py, 1, 16);

        if (n(0, -1)) { ctx.fillStyle = '#5c9e45'; for (let k = 0; k < 3; k++) ctx.fillRect(px + Math.floor(hash2(x, y, k) * 15), py, 1, 2); }

        if (up === T.VOID && t !== T.EBRIDGE) { ctx.fillStyle = '#e0d9be'; ctx.fillRect(px, py, 16, 2); ctx.fillStyle = '#b8af90'; ctx.fillRect(px, py + 2, 16, 1); }

  },
  drawGround(ctx, camX, camY, vw, vh, t) {
    const frame = Math.floor(t * 3) % 4;
    const x0 = Math.floor(camX / TILE), y0 = Math.floor(camY / TILE), x1 = Math.ceil((camX + vw) / TILE), y1 = Math.ceil((camY + vh) / TILE);

    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const tt = this.get(x, y);
      if (tt === T.VOID) continue;
      if (tt === T.WATER || tt === T.DEEP || tt === T.DRAWB || tt === T.EBRIDGE || (tt === T.CANAL && F.irrigation) || tt === T.AQUA) {

      for (let cx = Math.floor(camX / CS); cx <= Math.floor((camX + vw) / CS); cx++) {

  hasVoidInView(camX, camY, vw, vh) {

      case 'flowerbed': { const c = Art.prop('planter', o.v % 2); if (F.lazy || F.greenhouse) img(c, 0, 2); else { ctx.globalAlpha = 0.6; img(c, 0, 2); ctx.globalAlpha = 1; } break; }
      case 'plant': { const ok = F.plants12; const c = Art.bush(ok ? 2 : 0); ctx.save(); if (!ok) { ctx.globalAlpha = 0.85; } img(c, 0, 2); ctx.restore(); if (!ok) { ctx.fillStyle = '#8a7a52'; ctx.fillRect(bx - 4, by - 10, 8, 2); } break; }

      case 'telescope': img(Art.prop('telescope')); break;
      case 'heliocore': { const on = !!F.helios; img(Art.prop('helioscore', on ? 1 : 0, on ? Math.floor(t * 6) % 8 : 0), 0, 2); break; }
      case 'stall': img(Art.prop('stall', o.v || 0), 0, 2); break;
      case 'vgate': { const open = this.gateOpen(o); const c = this.vgateSprite(open, Math.floor(t * 8) % 4); ctx.drawImage(c, bx - 8, by - c.height + 16); break; }

      case 'drone': { const c = Art.robot('drone', !!F.drone_found, Math.floor(t * 10) % 2); ctx.drawImage(c, bx - 8, by - 14 + Math.round(Math.sin(t * 3) * 1)); break; }
    }
  },
  lampOn(o) { const F = this.F || {}; const reg = this.regionAt(o.tx, o.ty); const powered = reg === 'aqua' ? F.aqua : F.solar; return powered && (Game.isNight() || Game.S.weather === 'rainy' || (F.nightlights && Game.isEvening())); },
  vgateSprite(open, f) {
    return Art.get('vgate' + open + f, () => {

      for (const y of [0, 48]) { pg.rect(2, y + 2, 12, 14, '#5e6d72'); pg.hline(2, y + 2, 12, '#9fb0b6'); pg.rect(5, y + 6, 6, 4, open ? '#3fd8a8' : '#e0504a'); pg.vline(12, y + 4, 10, '#4f8c3e'); }
      if (!open) for (let y = 16; y < 48; y++) for (let x = 3; x < 13; x++) if ((x + y + f) % 4 === 0) pg.set(x, y, 'rgba(125,249,255,0.8)'); else if ((x * 3 + y * 2 + f) % 7 === 0) pg.set(x, y, 'rgba(191,248,255,0.95)');

  vrootsSprite(cleared) {

  // ---------------- lights ----------------
  collectLights(camX, camY, vw, vh, out) {

// ============================================================
//  04 ENTITIES — Player Controller, NPC Manager, NOVA companion,
//  robots, ambient movers (boats, birds, train), particles.
// ============================================================
const Player = {
  x: 0, y: 0, dir: 'down', moving: false, anim: 0, stepT: 0, speed: 74, idleT: 0, look: 'ari',
  box() { return { x: this.x - 5, y: this.y - 6, w: 10, h: 6 }; },
  blockedAt(x, y) {
    if (World.rectBlocked(x - 5, y - 6, 10, 6)) return true;
    for (const n of NPCs.list) { if (!n.visible() || n.ghost) continue; if (Math.abs(n.x - x) < 9 && Math.abs(n.y - y) < 6) return true; }
    return false;
  },
  update(dt, ix, iy, run) {
    const len = Math.hypot(ix, iy);
    this.moving = len > 0.15;
    if (this.moving) {
      if (len > 1) { ix /= len; iy /= len; }
      if (Math.abs(ix) > Math.abs(iy) + 0.05) this.dir = ix < 0 ? 'left' : 'right'; else if (Math.abs(iy) > 0.05) this.dir = iy < 0 ? 'up' : 'down';
      const sp = this.speed * (run ? 1.55 : 1) * dt;
      const dx = ix * sp, dy = iy * sp;
      if (!this.blockedAt(this.x + dx, this.y)) this.x += dx;
      else if (Math.abs(dx) > 0.01 && Math.abs(iy) < 0.3) { for (const n of [1, 2, 3, 4, 5, 6]) { if (!this.blockedAt(this.x + dx, this.y - n) && !this.blockedAt(this.x, this.y - n)) { this.y -= Math.min(n, sp); break; } if (!this.blockedAt(this.x + dx, this.y + n) && !this.blockedAt(this.x, this.y + n)) { this.y += Math.min(n, sp); break; } } }
      if (!this.blockedAt(this.x, this.y + dy)) this.y += dy;
      else if (Math.abs(dy) > 0.01 && Math.abs(ix) < 0.3) { for (const n of [1, 2, 3, 4, 5, 6]) { if (!this.blockedAt(this.x - n, this.y + dy) && !this.blockedAt(this.x - n, this.y)) { this.x -= Math.min(n, sp); break; } if (!this.blockedAt(this.x + n, this.y + dy) && !this.blockedAt(this.x + n, this.y)) { this.x += Math.min(n, sp); break; } } }
      this.x = clamp(this.x, 6, World.W * TILE - 6); this.y = clamp(this.y, 8, World.H * TILE - 2);
      this.anim += dt * (run ? 11 : 8);
      this.stepT += dt * (run ? 1.5 : 1);
      if (this.stepT > 0.32) { this.stepT = 0; AudioMgr.sfx('step'); if (World.get(Math.floor(this.x / TILE), Math.floor(this.y / TILE)) === T.WATER) Particles.emit('splash', this.x, this.y, 2); }
      this.idleT = 0;
    } else { this.anim = 0; this.idleT += dt; }
  },
  draw(ctx, camX, camY, t) {
    const S = Art.chars[this.look];
    const set = S[this.dir];
    let fr;
    if (this.moving) fr = set.walk[Math.floor(this.anim) % 4];
    else fr = set.idle[(Math.floor(t * 10) % 40 === 0 || Math.floor(t * 10) % 40 === 1) ? 1 : 0];
    const bob = !this.moving && Math.floor(t * 2) % 2 === 1 ? 1 : 0;
    const x = Math.round(this.x - camX), y = Math.round(this.y - camY);
    ctx.fillStyle = 'rgba(20,40,30,0.3)'; ctx.fillRect(x - 5, y - 2, 10, 3); ctx.fillRect(x - 4, y - 3, 8, 5);
    ctx.drawImage(fr, 0, 0, 12, 21 - bob, x - 6, y - 21 + bob, 12, 21 - bob);
  },
  front(d = 12) {
    const v = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[this.dir];
    return { x: this.x + v[0] * d, y: this.y - 4 + v[1] * d };
  }
};

class NPC {
  constructor(def) {
    this.def = def; this.id = def.id; this.look = def.look || def.id; this.name = def.name;
    this.dir = 'down'; this.anim = 0; this.timer = Math.random() * 3; this.target = null; this.talking = false;
    this.place();
  }
  place() {
    const p = this.def.pos(Game.S.flags);
    this.key = p.join(',');
    this.hx = (p[0] + 0.5) * TILE; this.hy = (p[1] + 1) * TILE - 2;
    this.x = this.hx; this.y = this.hy; this.target = null;
  }
  visible() {
    if (this.def.hidden && this.def.hidden(Game.S.flags)) return false;
    if (this.def.nightHome && Game.isNight() && !Game.S.flags.helios) return false;
    return true;
  }
  update(dt) {
    const p = this.def.pos(Game.S.flags);
    if (p.join(',') !== this.key) this.place();
    if (this.talking) { this.anim = 0; return; }
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 2 + Math.random() * 4;
      const r = this.def.wander ?? 1.5;
      if (r > 0 && Math.random() < 0.6) this.target = { x: this.hx + (Math.random() * 2 - 1) * r * TILE, y: this.hy + (Math.random() * 2 - 1) * r * TILE * 0.6 };
      else { this.target = null; if (Math.random() < 0.5) this.dir = pick(Math.random, ['down', 'left', 'right', 'down']); }
    }
    if (this.target) {
      const dx = this.target.x - this.x, dy = this.target.y - this.y, d = Math.hypot(dx, dy);
      if (d < 1.5) { this.target = null; this.anim = 0; return; }
      const sp = 26 * dt, mx = dx / d * sp, my = dy / d * sp;
      if (Math.abs(dx) > Math.abs(dy)) this.dir = dx < 0 ? 'left' : 'right'; else this.dir = dy < 0 ? 'up' : 'down';
      const nx = this.x + mx, ny = this.y + my;
      const pb = Math.abs(Player.x - nx) < 10 && Math.abs(Player.y - ny) < 7;
      if (!World.rectBlocked(nx - 5, ny - 6, 10, 6) && !pb) { this.x = nx; this.y = ny; this.anim += dt * 6; }
      else this.target = null;
    } else this.anim = 0;
  }
  faceTo(x, y) { const dx = x - this.x, dy = y - this.y; if (Math.abs(dx) > Math.abs(dy)) this.dir = dx < 0 ? 'left' : 'right'; else this.dir = dy < 0 ? 'up' : 'down'; }
  draw(ctx, camX, camY, t) {
    const x = Math.round(this.x - camX), y = Math.round(this.y - camY);
    ctx.fillStyle = 'rgba(20,40,30,0.3)'; ctx.fillRect(x - 5, y - 2, 10, 3);
    if (this.def.robot) {
      const c = Art.robot(this.def.robot, Game.S.flags[this.def.onFlag] || !this.def.onFlag, Math.floor(t * 3) % 2);
      ctx.drawImage(c, x - Math.floor(c.width / 2), y - c.height + 1);
    } else {
      const S = Art.chars[this.look][this.dir];
      const fr = this.anim > 0 ? S.walk[Math.floor(this.anim) % 4] : S.idle[(Math.floor(t * 10 + this.hx) % 50 < 2) ? 1 : 0];
      ctx.drawImage(fr, x - 6, y - 21);
    }
    // quest marker
    const mk = Quests.markerFor(this.id);
    if (mk) {
      const by = y - (this.def.robot ? 30 : 30) + Math.round(Math.sin(t * 4) * 2);
      Font.draw(ctx, mk, x, by, mk === '!' ? '#ffe17a' : '#7df9ff', { align: 'center', outline: OL });
    }
  }
}

// ---------------- NOVA ----------------
const Nova = {
  x: 0, y: 0, vx: 0, vy: 0, bubble: null, bubbleT: 0, idleT: 0, nextTalk: 25,
  reset() { this.x = Player.x - 14; this.y = Player.y - 4; this.bubble = null; },
  say(text, dur = 4.5) { this.bubble = text; this.bubbleT = dur; AudioMgr.sfx('nova'); },
  update(dt) {
    const off = { down: [-14, -8], up: [12, 8], left: [14, -4], right: [-14, -4] }[Player.dir];
    const tx = Player.x + off[0], ty = Player.y + off[1];
    const k = 4;
    this.vx += ((tx - this.x) * k - this.vx * 2.6) * dt;
    this.vy += ((ty - this.y) * k - this.vy * 2.6) * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (Math.hypot(tx - this.x, ty - this.y) > 120) { this.x = tx; this.y = ty; }
    if (this.bubble) { this.bubbleT -= dt; if (this.bubbleT <= 0) this.bubble = null; }
    // point out nearby quest targets
    if (Game.state === 'play' && !Dialogue.active && !this.bubble) {
      const q = Quests.tracked(), tp = q && Quests.targetPos(q);
      if (tp && q.t !== 'talk') {
        const d = Math.hypot(tp.x - Player.x, tp.y - Player.y);
        const key = q.q.id + ':' + (q.id || q.item || q.obj || '');
        if (d < 90 && d > 24 && this.pointed !== key) { this.pointed = key; this.say('Lihat! Itu tujuan kita di dekat sini. Dekati lalu tekan ' + (Game.touchUI ? 'tombol aksi' : 'E') + '.', 4); }
      }
    }
    // idle chatter
    if (Game.state === 'play' && !Dialogue.active) {
      this.nextTalk -= dt;
      if (this.nextTalk <= 0) { this.nextTalk = 35 + Math.random() * 30; const line = NovaTalk.ambient(); if (line) this.say(line, 5); }
    }
  },
  draw(ctx, camX, camY, t) {
    const x = Math.round(this.x - camX), y = Math.round(this.y - camY + Math.sin(t * 3) * 2);
    ctx.fillStyle = 'rgba(20,40,30,0.2)'; ctx.fillRect(x - 4, Math.round(this.y - camY) + 6, 8, 2);
    const blink = Math.floor(t * 10) % 37 === 0 ? 3 : Math.floor(t * 2) % 2;
    ctx.drawImage(Art.nova(blink), x - 7, y - 12);
  },
  drawBubble(ctx, camX, camY, vw) {
    if (!this.bubble) return;
    const lines = Font.wrap(this.bubble, 130);
    const w = Math.max(...lines.map(l => Font.width(l))) + 8, h = lines.length * 10 + 5;
    let x = Math.round(this.x - camX - w / 2), y = Math.round(this.y - camY - 18 - h);
    x = clamp(x, 2, vw - w - 2); y = Math.max(30, y);
    ctx.fillStyle = OL; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#eef8f2'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#7fe0d0'; ctx.fillRect(x, y, w, 1);
    lines.forEach((l, i) => Font.draw(ctx, l, x + 4, y + 3 + i * 10, '#1f3a3a'));
  }
};

// ---------------- moving robots & ambient movers ----------------
const Movers = {
  list: [],
  init() {
    this.list = [
      { kind: 'sprout', path: [[102, 31], [117, 31]], speed: 18, t: 0, flag: 'robot' },
      { kind: 'delivery', path: [[78, 45], [90, 45], [90, 52], [70, 52], [70, 45]], speed: 26, t: 0, flag: 'delivery' },
      { kind: 'roots', path: [[19, 56], [26, 56], [26, 59], [19, 59]], speed: 12, t: 0, flag: 'forest' },
      { kind: 'boat', seg: [52, 62], y: 67.5, speed: 14, t: 0 },
      { kind: 'boat', seg: [66, 79], y: 79.5, speed: 11, t: 0.5 },
      { kind: 'boat', seg: [40, 62], y: 90.5, speed: 12, t: 0.2 },
      { kind: 'train', t: 0 }
    ];
    for (let i = 0; i < 6; i++) this.list.push({ kind: 'bird', cx: 40 + Math.random() * 50, cy: 4 + Math.random() * 18, r: 4 + Math.random() * 6, sp: 0.3 + Math.random() * 0.3, ph: Math.random() * 6 });
  },
  pos(m, t) {
    if (m.path) {
      const pts = m.path.map(p => [(p[0] + 0.5) * TILE, (p[1] + 1) * TILE - 2]);
      let total = 0; const segs = [];
      for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, l]); total += l; }
      if (pts.length === 2) total = segs[0][2] * 2;
      let d = (t * m.speed) % total;
      if (pts.length === 2) { const L = segs[0][2]; const fw = d < L; const q = fw ? d / L : 1 - (d - L) / L; return { x: lerp(pts[0][0], pts[1][0], q), y: lerp(pts[0][1], pts[1][1], q), dir: fw ? 'right' : 'left' }; }
      for (const [a, b, l] of segs) { if (d <= l) { const q = d / l; return { x: lerp(a[0], b[0], q), y: lerp(a[1], b[1], q), dir: Math.abs(b[0] - a[0]) > Math.abs(b[1] - a[1]) ? (b[0] > a[0] ? 'right' : 'left') : (b[1] > a[1] ? 'down' : 'up') }; } d -= l; }
    }
    return { x: 0, y: 0 };
  },
  renderables(camX, camY, vw, vh, t, out) {
    const F = Game.S.flags;
    for (const m of this.list) {
      if (m.flag && !F[m.flag]) continue;
      if (m.kind === 'boat' || m.kind === 'bird' || m.kind === 'train') continue;
      const p = this.pos(m, t + m.t * 100);
      if (p.x < camX - 30 || p.x > camX + vw + 30 || p.y < camY - 30 || p.y > camY + vh + 30) continue;
      out.push({ y: p.y, draw: (ctx) => { const c = Art.robot(m.kind, true, Math.floor(t * 5) % 2); ctx.fillStyle = 'rgba(20,40,30,0.3)'; ctx.fillRect(Math.round(p.x - camX) - 6, Math.round(p.y - camY) - 2, 12, 3); ctx.drawImage(c, Math.round(p.x - camX - c.width / 2), Math.round(p.y - camY - c.height + 1)); if (m.kind === 'sprout' && F.irrigation && Math.floor(t * 4) % 3 === 0) Particles.emit('splash', p.x, p.y - 4, 1); } });
    }
  },
  drawWaterLayer(ctx, camX, camY, vw, vh, t) {
    for (const m of this.list) {
      if (m.kind !== 'boat') continue;
      const x0 = m.seg[0] * TILE, x1 = m.seg[1] * TILE, L = x1 - x0 - 30;
      const d = (t * m.speed + m.t * 300) % (L * 2);
      const x = d < L ? x0 + d : x0 + 2 * L - d;
      const y = m.y * TILE;
      if (x < camX - 40 || x > camX + vw + 10 || y < camY - 20 || y > camY + vh + 20) continue;
      const c = Art.prop('boat');
      ctx.save();
      const X = Math.round(x - camX), Y = Math.round(y - camY - 8 + Math.sin(t * 2 + m.t * 9));
      if (d >= L) { ctx.translate(X + 30, Y); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0); } else ctx.drawImage(c, X, Y);
      ctx.restore();
      if (Math.floor(t * 6) % 2) { ctx.fillStyle = 'rgba(216,243,250,0.8)'; ctx.fillRect(Math.round(x - camX) + (d < L ? -2 : 31), Math.round(y - camY) + 3, 2, 1); }
    }
  },
  drawOverhead(ctx, camX, camY, vw, vh, t) {
    // train at station: arrives, waits, leaves (cycle 40s)
    const ty = 57 * TILE + 12;
    if (ty > camY - 30 && ty < camY + vh + 30) {
      const cyc = t % 40; let x;
      const stop = 82.5 * TILE;
      if (cyc < 8) x = lerp(94 * TILE, stop, Math.sin(cyc / 8 * Math.PI / 2));
      else if (cyc < 20) x = stop;
      else if (cyc < 28) x = lerp(stop, 94 * TILE, 1 - Math.cos((cyc - 20) / 8 * Math.PI / 2));
      else x = 94 * TILE;
      if (x < 94 * TILE) {
        ctx.save(); ctx.beginPath(); ctx.rect(82 * TILE - camX, ty - 30 - camY, 11 * TILE, 40); ctx.clip();
        for (let i = 0; i < 3; i++) { const c = Art.prop('train', i ? 1 : 0); ctx.drawImage(c, Math.round(x + i * 40 - camX), Math.round(ty - 18 - camY)); }
        ctx.restore();
      }
    }
    // mechanical birds over the sky garden
    for (const m of this.list) {
      if (m.kind !== 'bird') continue;
      const a = t * m.sp + m.ph;
      const x = (m.cx + Math.cos(a) * m.r * 2) * TILE, y = (m.cy + Math.sin(a * 2) * m.r * 0.5) * TILE;
      if (x < camX - 20 || x > camX + vw + 20 || y < camY - 20 || y > camY + vh + 20) continue;
      const c = Art.robot('bird', true, Math.floor(t * 6 + m.ph) % 2);
      const dirR = -Math.sin(a) > 0;
      ctx.save(); const X = Math.round(x - camX), Y = Math.round(y - camY);
      if (!dirR) { ctx.translate(X + 12, Y); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0); } else ctx.drawImage(c, X, Y);
      ctx.restore();
    }
  }
};

// ---------------- particles ----------------
const Particles = {
  list: [], rain: [],
  emit(kind, x, y, n = 1, o = {}) {
    for (let i = 0; i < n; i++) {
      const p = { kind, x, y, vx: 0, vy: 0, life: 1, max: 1, col: '#fff', s: 1, ph: Math.random() * 6 };
      switch (kind) {
        case 'splash': p.vx = (Math.random() - 0.5) * 30; p.vy = -20 - Math.random() * 30; p.life = p.max = 0.6; p.col = Math.random() < 0.5 ? '#bfeaf5' : '#73c6e2'; p.g = 90; break;
        case 'sparkle': { const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 50; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 10; p.life = p.max = 0.8 + Math.random() * 0.6; p.col = pick(Math.random, ['#ffe17a', '#ffffff', '#7df9ff', '#b6ff9c']); p.g = 20; break; }
        case 'leaf': p.vx = 6 + Math.random() * 8; p.vy = 10 + Math.random() * 8; p.life = p.max = 5 + Math.random() * 3; p.col = pick(Math.random, o.cols || ['#86c75e', '#5fae55', '#c8a03a']); p.s = 2; break;
        case 'petal': p.vx = 8 + Math.random() * 10; p.vy = 6 + Math.random() * 6; p.life = p.max = 5; p.col = pick(Math.random, ['#ffd1e2', '#ffffff', '#f2a7c3']); p.s = 2; break;
        case 'firefly': p.vx = (Math.random() - 0.5) * 8; p.vy = (Math.random() - 0.5) * 8; p.life = p.max = 4 + Math.random() * 4; p.col = '#e8ff7a'; p.glow = true; break;
        case 'spore': p.vx = (Math.random() - 0.5) * 4; p.vy = -4 - Math.random() * 5; p.life = p.max = 4 + Math.random() * 3; p.col = pick(Math.random, ['#7df9ff', '#ff9ce6']); p.glow = true; break;
        case 'mote': p.vx = 2 + Math.random() * 3; p.vy = -1 - Math.random() * 2; p.life = p.max = 4 + Math.random() * 3; p.col = '#fff6c0'; break;
        case 'spark': p.vx = (Math.random() - 0.5) * 40; p.vy = -10 - Math.random() * 30; p.life = p.max = 0.4; p.col = '#7df9ff'; p.g = 80; break;
        case 'smoke': p.vx = 3; p.vy = -8; p.life = p.max = 2; p.col = 'rgba(230,230,220,0.6)'; p.s = 2; break;
      }
      this.list.push(p);
    }
    if (this.list.length > 600) this.list.splice(0, this.list.length - 600);
  },
  ambient(dt, camX, camY, vw, vh) {
    const reg = Game.region, night = Game.isNight(), F = Game.S.flags;
    const rx = () => camX + Math.random() * vw, ry = () => camY + Math.random() * vh;
    const chance = p => Math.random() < p * dt * 60;
    if (reg === 'forest') { if (!night && chance(0.05)) this.emit('leaf', rx(), camY - 4, 1, { cols: F.forest ? ['#86c75e', '#5fae55', '#9ccf6a'] : ['#c8a03a', '#8a7a52', '#86c75e'] }); if (night && chance(0.12)) this.emit('spore', rx(), ry()); if (chance(night ? 0.06 : 0.01)) this.emit('firefly', rx(), ry()); }
    if (reg === 'town' && !night && chance(0.03)) this.emit('mote', rx(), ry());
    if ((reg === 'farm' || reg === 'town') && night && chance(0.05)) this.emit('firefly', rx(), ry());
    if (reg === 'sky' && chance(0.04)) this.emit('petal', camX - 4, ry());
    if (reg === 'circuit' && F.circuit && chance(0.02)) this.emit('spark', rx(), ry());
    if (reg === 'farm' && !night && chance(0.02)) this.emit('mote', rx(), ry());
  },
  update(dt) {
    for (const p of this.list) {
      p.life -= dt;
      if (p.g) p.vy += p.g * dt;
      if (p.kind === 'leaf' || p.kind === 'petal') { p.vx += Math.sin(p.life * 3 + p.ph) * 20 * dt; }
      if (p.kind === 'firefly') { p.vx += (Math.random() - 0.5) * 30 * dt; p.vy += (Math.random() - 0.5) * 30 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    this.list = this.list.filter(p => p.life > 0);
  },
  draw(ctx, camX, camY, t) {
    for (const p of this.list) {
      const a = Math.min(1, p.life / Math.min(0.6, p.max) * 1.2);
      if (p.kind === 'firefly' && Math.sin(t * 5 + p.ph) < -0.3) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      const x = Math.round(p.x - camX), y = Math.round(p.y - camY);
      ctx.fillRect(x, y, p.s, p.s === 2 ? 1 : 1);
      if (p.s === 2) ctx.fillRect(x + 1, y + 1, 1, 1);
      if (p.glow) { ctx.globalAlpha = a * 0.35; ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
    }
    ctx.globalAlpha = 1;
  },
  glowLights(camX, camY, out) { for (const p of this.list) if (p.glow) out.push([p.x - camX, p.y - camY, 8, p.col]); },
  drawRain(ctx, vw, vh, dt, on) {
    if (on) while (this.rain.length < 110) this.rain.push({ x: Math.random() * (vw + 60), y: Math.random() * vh, v: 180 + Math.random() * 80 });
    else if (this.rain.length) this.rain.length = Math.max(0, this.rain.length - 4);
    ctx.fillStyle = 'rgba(190,220,240,0.55)';
    for (const r of this.rain) {
      r.y += r.v * dt; r.x -= r.v * 0.25 * dt;
      if (r.y > vh) { r.y = -6; r.x = Math.random() * (vw + 60); if (Math.random() < 0.2) r.splash = 0.15; }
      ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 4);
    }
  }
};

  changevar: { cat: 'var', kind: 'stmt', parts: [{ field: 'name', kind: 'var', def: 'x' }, '+=', { slot: 'v', def: '1' }] },
  var: { cat: 'var', kind: 'rep', parts: [{ field: 'name', kind: 'var', def: 'x' }] },

  int: { cat: 'input', kind: 'rep', parts: ['int(', { slot: 'v', def: '' }, ')'] },
  str: { cat: 'op', kind: 'rep', parts: ['str(', { slot: 'v', def: '' }, ')'] },
  if: { cat: 'cond', kind: 'c', parts: ['if', { slot: 'c', bool: true, def: '' }, ':'] },
  elif: { cat: 'cond', kind: 'c', parts: ['elif', { slot: 'c', bool: true, def: '' }, ':'] },
  else: { cat: 'cond', kind: 'c', parts: ['else:'] },
  compare: { cat: 'cond', kind: 'bool', parts: [{ slot: 'a', def: '' }, { field: 'op', kind: 'select', options: ['<', '>', '==', '!=', '<=', '>='], def: '<' }, { slot: 'b', def: '' }] },
  bool: { cat: 'cond', kind: 'bool', parts: [{ field: 'v', kind: 'select', options: ['True', 'False'], def: 'True' }] },
  logic: { cat: 'op', kind: 'bool', parts: [{ slot: 'a', bool: true, def: '' }, { field: 'op', kind: 'select', options: ['and', 'or'], def: 'and' }, { slot: 'b', bool: true, def: '' }] },
  not: { cat: 'op', kind: 'bool', parts: ['not', { slot: 'a', bool: true, def: '' }] },
  arith: { cat: 'op', kind: 'rep', parts: [{ slot: 'a', def: '' }, { field: 'op', kind: 'select', options: ['+', '-', '*', '/', '//', '%'], def: '+' }, { slot: 'b', def: '' }] },
  for: { cat: 'loop', kind: 'c', parts: ['for', { field: 'var', kind: 'ident', def: 'i' }, 'in range(', { slot: 'n', def: '3' }, '):'] },
  while: { cat: 'loop', kind: 'c', parts: ['while', { slot: 'c', bool: true, def: '' }, ':'] },

        case 'setvar': { if (!b.f.name) throw new PyError('SyntaxError', 'nama variabel kosong', 'Beri nama variabel.', id); setVar(b.f.name, slotVal(b.in.v, id)); snap(); break; }

        case 'append': { const L = getVar(b.f.name, id); if (!Array.isArray(L)) throw new PyError('AttributeError', `'${tname(L)}' object has no attribute 'append'`, `${b.f.name} bukan list.`, id); L.push(slotVal(b.in.v, id)); snap(); break; }

// ---------- lint ----------
function lintProgram(ws) {
  const issues = [];
  const main = ws.scripts.find(s => s.main);
  const loose = ws.scripts.filter(s => !s.main && s.blocks.length);
  if (loose.length) issues.push({ level: 'warn', msg: `Ada ${loose.length} kelompok blok yang belum tersambung ke START. Blok yang tidak tersambung tidak akan dijalankan.` });
  if (main && main.blocks.length <= 1) issues.push({ level: 'error', msg: 'Belum ada instruksi di bawah START. Seret blok dari palet dan sambungkan di bawah START.' });
  if (main) walkBlocks(main.blocks, b => {
    if (b.body && !b.body.length && b.type !== 'start') issues.push({ level: 'warn', msg: `Blok ${b.type} masih kosong (belum ada isi di dalamnya).`, id: b.id });
  });
  return issues;
}
function countBlocks(list, type) { let n = 0; walkBlocks(list, b => { if (b.type === type) n++; }); return n; }
function findBlocks(list, type) { const r = []; walkBlocks(list, b => { if (b.type === type) r.push(b); }); return r; }
function usesInside(list, outerType, innerType) { let ok = false; walkBlocks(list, b => { if (b.type === outerType && b.body) { if (countBlocks(b.body, innerType)) ok = true; } }); return ok; }

// grid simulation for delivery puzzle (pure, used by check + sim)
function gridSim(g, events) {
  let [x, y] = g.start, step = 0;
  const path = [[x, y]];
  for (const e of events) {
    if (e.k !== 'act' || e.name !== 'move') continue;
    step++;
    const d = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] }[e.arg] || [0, 0];
    x += d[0]; y += d[1];
    if (x < 0 || y < 0 || x >= g.w || y >= g.h) return { crash: 'pagar', step, path };
    if (g.walls.some(w => w[0] === x && w[1] === y)) return { crash: 'rumah warga', step, path };
    path.push([x, y]);
  }
  return { goal: x === g.goal[0] && y === g.goal[1], path };
}

const Toasts = {
  list: [],
  push(text, kind = 'info') { this.list.push({ text, kind, t: 0 }); if (this.list.length > 4) this.list.shift(); },
  update(dt) { for (const t of this.list) t.t += dt; this.list = this.list.filter(t => t.t < 4.2); },
  draw(ctx, vw, y0) {
    let y = y0 || 30;
    for (const t of this.list) {
      const a = t.t < 0.25 ? t.t / 0.25 : t.t > 3.6 ? (4.2 - t.t) / 0.6 : 1;
      const w = Font.width(t.text) + 14, x = Math.round(vw / 2 - w / 2);
      const col = { quest: '#f6c945', xp: '#7df9ff', item: '#b6ff9c', ach: '#ff9ce6', warn: '#f0913a', info: '#f3e9d2' }[t.kind] || '#f3e9d2';
      ctx.globalAlpha = a;
      ctx.fillStyle = OL; ctx.fillRect(x - 1, y - 1, w + 2, 14);
      ctx.fillStyle = '#1f3a2c'; ctx.fillRect(x, y, w, 12);
      ctx.fillStyle = col; ctx.fillRect(x, y, 3, 12);
      Font.draw(ctx, t.text, x + 8, y + 2, col);
      ctx.globalAlpha = 1;
      y += 15;
    }
  }
};

const Progress = {
  need(lv) { return 80 + (lv - 1) * 60; },
  addXP(n) {
    const S = Game.S;
    const bonus = 1 + this.rankIndex() * 0.05;
    n = Math.round(n * bonus);
    S.xp += n; Toasts.push(`+${n} XP`, 'xp');
    while (S.xp >= this.need(S.lv)) { S.xp -= this.need(S.lv); S.lv++; Toasts.push(`LEVEL UP! Level ${S.lv}`, 'quest'); AudioMgr.sfx('levelup'); Particles.emit('sparkle', Player.x, Player.y - 12, 24); }
  },
  addCredits(n) { Game.S.cr += n; if (n > 0) { Toasts.push(`+${n} Credits`, 'item'); AudioMgr.sfx('coin'); } },
  rankIndex() { const n = Object.keys(Game.S.solved).length; let r = 0; RANKS.forEach((k, i) => { if (n >= k[0]) r = i; }); return r; },
  rank() { return RANKS[this.rankIndex()][1]; },
  unlockCodebook(ids) {
    for (const id of ids || []) if (!Game.S.codebook[id] && CODEBOOK[id]) { Game.S.codebook[id] = true; Toasts.push('Codebook: ' + CODEBOOK[id].title, 'ach'); }
  },
  unlockArchive(ids) { for (const id of ids || []) if (!Game.S.archives[id]) { Game.S.archives[id] = true; Toasts.push('Arsip baru: ' + ARCHIVES[id].title, 'ach'); } },
  ach(id) {
    if (Game.S.ach[id] || !ACHIEVEMENTS[id]) return;
    Game.S.ach[id] = Game.S.day * 10000 + Math.floor(Game.S.time);
    Toasts.push('★ ' + ACHIEVEMENTS[id].name, 'ach'); AudioMgr.sfx('sparkle');
  },
  checkAch() {
    const S = Game.S;
    const n = Object.keys(S.solved).length;
    if (n >= 1) this.ach('first_program');
    if (n >= 5) this.ach('logic_apprentice');
    if (Object.keys(S.codebook).length >= 12) this.ach('python_explorer');
    if (S.stats.loops >= 5) this.ach('master_loops');
    if (S.stats.flows >= 4) this.ach('flowchart_arch');
    if (['q_begin', 'q_robot', 'q_water', 'q_solar', 'q_wind', 'q_sequence', 'q_aqua', 'q_garden', 'q_sky'].every(q => Quests.done(q))) this.ach('verdantia_restorer');
    if (Quests.done('q_helios')) this.ach('helios_guardian');
    if (S.counters.regions >= 6) this.ach('explorer');
    if (S.counters.crystals >= 6) this.ach('crystal_hunter');
    if (S.counters.friends >= 12) this.ach('friend');

// ---------------- Quests ----------------
const Quests = {
  st(id) { return Game.S.quests[id]; },
  done(id) { const s = this.st(id); return !!(s && s.s === 'done'); },
  active(id) { const s = this.st(id); return !!(s && s.s === 'active'); },
  reqMet(q) { return (q.req || []).every(r => this.done(r)); },
  available(q) { return !this.st(q.id) && !q.secret && !q.auto && this.reqMet(q); },
  cur(id) { const s = this.st(id); if (!s || s.s !== 'active') return null; return QMAP[id].obj[s.i]; },
  start(id, silent) {
    if (this.st(id)) return;
    const q = QMAP[id];
    Game.S.quests[id] = { s: 'active', i: 0 };
    if (!silent) { Toasts.push((q.secret ? 'Quest rahasia: ' : 'Quest baru: ') + q.name, 'quest'); AudioMgr.sfx('unlock'); }
    this.autoCheck(id);
  },
  autoCheck(id) {
    const o = this.cur(id); if (!o) return;
    if (o.t === 'have' && Inventory.count(o.item) >= o.n) this.advance(id);
    else if (o.t === 'count' && (Game.S.counters[o.key] || 0) >= o.n) this.advance(id);
    else if (o.t === 'puzzle' && Game.S.solved[o.id]) this.advance(id);
    else if (o.t === 'find' && Game.S.flags['found_' + o.obj]) this.advance(id);
  },
  advance(id) {
    const s = this.st(id), q = QMAP[id];
    s.i++;
    if (s.i >= q.obj.length) { this.complete(id); return; }
    Toasts.push('▶ ' + q.obj[s.i].text, 'info');
    this.autoCheck(id);
  },
  complete(id) {
    const s = this.st(id), q = QMAP[id], r = q.reward || {};
    s.s = 'done';
    AudioMgr.sfx('quest');
    Toasts.push('Quest selesai: ' + q.name, 'quest');
    if (r.flags) for (const f of r.flags) Game.setFlag(f);
    if (r.xp) Progress.addXP(r.xp);
    if (r.cr) Progress.addCredits(r.cr);
    if (r.items) for (const k in r.items) Inventory.add(k, r.items[k]);
    Game.S.rep += q.type === 'main' ? 10 : 5;
    if (r.archive) Progress.unlockArchive(r.archive);
    Progress.checkAch();
    if (q.done && q.giver) Game.queueDialogue(q.done.map(t => ({ who: q.giver, text: t })));
    if (id === 'q_helios') Game.queueEnding = true;
    Particles.emit('sparkle', Player.x, Player.y - 10, 30);
    Save.save();
  },
  notify(type, key) {
    for (const id in Game.S.quests) {
      const o = this.cur(id); if (!o) continue;
      if (type === 'have' && o.t === 'have' && Inventory.count(o.item) >= o.n) this.advance(id);
      else if (type === 'count' && o.t === 'count' && o.key === key && (Game.S.counters[key] || 0) >= o.n) this.advance(id);
      else if (type === 'puzzle' && o.t === 'puzzle' && o.id === key) {
        if (o.consume) for (const k in o.consume) Inventory.remove(k, o.consume[k]);
        this.advance(id);
      }
      else if (type === 'find' && o.t === 'find' && o.obj === key) this.advance(id);
      else if (type === 'visit' && o.t === 'visit' && o.region === key) this.advance(id);
    }
  },
  // returns lines for an NPC talk, plus side effects. null if none.
  talkTo(npcId) {
    // 1. talk objective
    for (const id in Game.S.quests) {
      const o = this.cur(id);
      if (o && o.t === 'talk' && o.npc === npcId) {
        const lines = (o.say || ['...']).map(t => ({ who: npcId, text: t }));
        return { kind: 'talk', lines, after: () => { if (o.give) for (const k in o.give) Inventory.add(k, o.give[k]); this.advance(id); } };
      }
    }
    // 2. new quest offer
    for (const q of QUESTS) if (q.giver === npcId && this.available(q)) {
      const lines = (q.offer || ['Aku butuh bantuanmu.']).map(t => ({ who: npcId, text: t }));
      return { kind: 'offer', lines, after: () => this.start(q.id) };
    }
    // 3. progress hint on active quest
    for (const q of QUESTS) if (q.giver === npcId && this.active(q.id) && q.progress) {
      const o = this.cur(q.id);
      return { kind: 'progress', lines: q.progress.map(t => ({ who: npcId, text: t })).concat([{ who: 'nova', text: 'Tujuan saat ini: ' + o.text + '.' }]) };
    }
    return null;
  },
  markerFor(npcId) {
    for (const id in Game.S.quests) { const o = this.cur(id); if (o && o.t === 'talk' && o.npc === npcId) return '?'; }
    for (const q of QUESTS) if (q.giver === npcId && this.available(q)) return '!';
    return null;
  },
  activeList() { return QUESTS.filter(q => this.active(q.id)); },
  tracked() {
    const order = ['main', 'side', 'secret', 'explore'];
    const pref = Game.S.trackQuest && this.active(Game.S.trackQuest) ? [QMAP[Game.S.trackQuest]] : [];
    const act = pref.concat(this.activeList().sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type)));
    for (const q of act) { const o = this.cur(q.id); if (o) return Object.assign({ q }, o); }
    // suggest available main quest giver
    for (const q of QUESTS) if (q.type === 'main' && this.available(q)) { const n = NPC_DEFS.find(d => d.id === q.giver); return { q, t: 'talk', npc: q.giver, text: 'Bicara dengan ' + (n ? n.name : q.giver) + ' (quest baru)', suggest: true }; }
    return null;
  },
  targetPos(o) {
    if (!o) return null;
    let at = o.at;
    if (o.t === 'talk') at = 'npc:' + o.npc;
    if (o.t === 'have' && o.item === 'repair_kit' && !at) at = 'npc:rani';
    if (o.t === 'have' && !at && o.item === 'bio_seed') at = 'npc:luma';
    if (!at) return null;
    if (at.startsWith('npc:')) { const n = NPCs.get(at.slice(4)); return n ? { x: n.x, y: n.y - 10 } : null; }
    const ob = World.byId[at]; return ob ? { x: ob.bx, y: ob.by - 12 } : null;
  }
};

// ---------------- Dialogue ----------------
const Dialogue = {
  active: false, lines: [], i: 0, shown: 0, onEnd: null, sel: 0, blipT: 0,
  start(lines, onEnd) {
    if (!lines || !lines.length) { if (onEnd) onEnd(); return; }
    this.lines = lines.map(l => typeof l === 'string' ? { who: 'sys', text: l } : l);
    this.i = 0; this.shown = 0; this.onEnd = onEnd || null; this.active = true; this.sel = 0;
    AudioMgr.sfx('open');
  },
  text() { const l = this.lines[this.i]; return l ? l.text.replace(/\{name\}/g, Game.S.name) : ''; },
  update(dt) {
    if (!this.active) return;
    const full = this.text().length;
    if (this.shown < full) {
      const sp = [25, 45, 90][Game.settings.textSpeed ?? 1];
      const before = Math.floor(this.shown);
      this.shown = Math.min(full, this.shown + dt * sp);
      if (Math.floor(this.shown) !== before && Math.floor(this.shown) % 2 === 0) AudioMgr.sfx('type');
    }
  },
  advance() {
    if (!this.active) return;
    const l = this.lines[this.i];
    if (this.shown < this.text().length) { this.shown = this.text().length; return; }
    if (l.choices) { const c = l.choices[this.sel]; this.close(); if (c && c.fn) c.fn(); return; }
    this.i++; this.shown = 0; this.sel = 0;
    if (this.i >= this.lines.length) this.close();
    else AudioMgr.sfx('blip');
  },
  close() {
    this.active = false;
    for (const n of NPCs.list) n.talking = false;
    const cb = this.onEnd; this.onEnd = null;
    if (cb) cb();
    Game.afterDialogue();
  },
  move(d) { const l = this.lines[this.i]; if (l && l.choices && this.shown >= this.text().length) { this.sel = (this.sel + d + l.choices.length) % l.choices.length; AudioMgr.sfx('click'); } },
  layout(vw, vh) {
    const bottom = Game.touchUI ? (vw < 300 ? 82 : 70) : 6;
    if (vw < 300) { const w = vw - 8; const n = Math.min(7, Font.wrap(this.text(), w - 12).length); const h = Math.max(36, 14 + n * 10); return { x: 4, y: vh - h - bottom, w, h, narrow: true }; }
    const w = Math.min(vw - 8, 360), h = 62; return { x: Math.round((vw - w) / 2), y: vh - h - bottom, w, h };
  },
  click(px, py, vw, vh) {
    const L = this.layout(vw, vh), l = this.lines[this.i];
    if (l && l.choices && this.shown >= this.text().length) {
      const cy0 = L.narrow ? L.y - 36 - l.choices.length * 13 : L.y - l.choices.length * 13 - 4;
      for (let k = 0; k < l.choices.length; k++) { const y = cy0 + k * 13; if (py >= y && py < y + 12 && px >= L.x + L.w - 130 && px <= L.x + L.w) { this.sel = k; this.advance(); return; } }
    }
    this.advance();
  },
  draw(ctx, vw, vh, t) {
    if (!this.active) return;
    const l = this.lines[this.i]; if (!l) return;
    const L = this.layout(vw, vh);
    const who = l.who;
    const npc = NPCs.get(who);
    const name = who === 'nova' ? 'NOVA' : who === 'sys' ? 'SISTEM' : who === 'player' ? Game.S.name : npc ? npc.name : (NPC_DEFS.find(d => d.id === who) || {}).name || who;
    const portrait = who === 'player' ? Art.portraits.ari : Art.portraits[who] || Art.portraits.sys;
    ctx.fillStyle = OL; ctx.fillRect(L.x - 2, L.y - 2, L.w + 4, L.h + 4);
    ctx.fillStyle = '#f3e9d2'; ctx.fillRect(L.x, L.y, L.w, L.h);
    if (L.narrow) {
      ctx.fillStyle = '#a3b18a'; ctx.fillRect(L.x, L.y, L.w, 2);
      ctx.fillStyle = OL; ctx.fillRect(L.x + 2, L.y - 31, 32, 32); ctx.fillStyle = who === 'nova' ? '#2f6f6a' : who === 'sys' ? '#2a3a3a' : '#a3c49a'; ctx.fillRect(L.x + 3, L.y - 30, 30, 30);
      if (portrait) ctx.drawImage(portrait, 1, 1, 30, 30, L.x + 3, L.y - 30, 30, 30);
      const nw2 = Font.width(name) + 8; ctx.fillStyle = OL; ctx.fillRect(L.x + 35, L.y - 13, nw2 + 2, 13); ctx.fillStyle = '#1f3a2c'; ctx.fillRect(L.x + 36, L.y - 12, nw2, 11);
      Font.draw(ctx, name, L.x + 40, L.y - 11, '#f6c945');
      const tx2 = this.text().slice(0, Math.floor(this.shown));
      Font.wrap(tx2, L.w - 12).slice(0, 7).forEach((s, k) => Font.draw(ctx, s, L.x + 6, L.y + 6 + k * 10, '#22302a'));
      if (this.shown >= this.text().length && !l.choices && Math.floor(t * 3) % 2) Font.draw(ctx, '\u25B6', L.x + L.w - 10, L.y + L.h - 11, '#3f8f4f');
      if (l.choices && this.shown >= this.text().length) l.choices.forEach((c, k) => { const y = L.y - 36 - (l.choices.length - k) * 13, x = L.x + L.w - 130; ctx.fillStyle = OL; ctx.fillRect(x - 1, y - 1, 132, 14); ctx.fillStyle = k === this.sel ? '#f6c945' : '#f3e9d2'; ctx.fillRect(x, y, 130, 12); Font.draw(ctx, (k === this.sel ? '\u25B6 ' : '  ') + c.t, x + 4, y + 2, '#22302a'); });
      return;
    }
    ctx.fillStyle = '#a3b18a'; ctx.fillRect(L.x, L.y, L.w, 2); ctx.fillRect(L.x, L.y + L.h - 2, L.w, 2);
    // portrait frame
    ctx.fillStyle = '#1f3a2c'; ctx.fillRect(L.x + 5, L.y + 6, 40, 40);
    ctx.fillStyle = who === 'nova' ? '#2f6f6a' : who === 'sys' ? '#2a3a3a' : '#a3c49a'; ctx.fillRect(L.x + 7, L.y + 8, 36, 36);
    if (portrait) ctx.drawImage(portrait, L.x + 9, L.y + 10 + (Math.floor(t * 2) % 2 && this.shown < this.text().length ? 1 : 0));
    // name tag
    const nw = Font.width(name) + 10;
    ctx.fillStyle = '#1f3a2c'; ctx.fillRect(L.x + 5, L.y + 47, Math.max(40, nw), 11);
    Font.draw(ctx, name, L.x + 5 + Math.max(40, nw) / 2, L.y + 48, '#f6c945', { align: 'center' });
    // text
    const txt = this.text().slice(0, Math.floor(this.shown));
    const lines = Font.wrap(txt, L.w - 62);
    lines.slice(0, 5).forEach((s, k) => Font.draw(ctx, s, L.x + 52, L.y + 6 + k * 10, '#22302a'));
    if (this.shown >= this.text().length && !l.choices && Math.floor(t * 3) % 2) Font.draw(ctx, '▶', L.x + L.w - 10, L.y + L.h - 12, '#3f8f4f');
    if (l.choices && this.shown >= this.text().length) {
      const cy0 = L.y - l.choices.length * 13 - 4;
      l.choices.forEach((c, k) => {
        const y = cy0 + k * 13, x = L.x + L.w - 130;
        ctx.fillStyle = OL; ctx.fillRect(x - 1, y - 1, 132, 14);
        ctx.fillStyle = k === this.sel ? '#f6c945' : '#f3e9d2'; ctx.fillRect(x, y, 130, 12);
        Font.draw(ctx, (k === this.sel ? '▶ ' : '  ') + c.t, x + 4, y + 2, '#22302a');
      });
    }
  }
};

// ---------------- Time & Weather ----------------
const TimeW = {
  update(dt) {
    const S = Game.S;
    const rate = [1, 2, 4][Game.settings.daySpeed ?? 1];
    S.time += dt * rate;
    if (S.time >= 1440) { S.time -= 1440; S.day++; }
    S.weatherT -= dt * rate;
    if (S.weatherT <= 0) this.rollWeather();
  },
  rollWeather() {
    const S = Game.S, r = Math.random();
    S.weather = r < 0.55 ? 'sunny' : r < 0.82 ? 'cloudy' : 'rainy';
    S.weatherT = 120 + Math.random() * 200;
    if (S.weather === 'rainy') Toasts.push('Hujan mulai turun...', 'info');
  },
  period(m = Game.S.time) { const h = m / 60; if (h >= 5 && h < 11) return 'Pagi'; if (h >= 11 && h < 16) return 'Siang'; if (h >= 16 && h < 19) return 'Sore'; return 'Malam'; },
  // ambient darkness/tint
  ambient(m = Game.S.time) {
    const h = m / 60;
    const K = [[0, 0.62, '#0b1838'], [4.5, 0.6, '#0b1838'], [5.5, 0.35, '#3a2a5a'], [6.5, 0.1, '#ff9a5a'], [8, 0, '#ffffff'], [16, 0, '#ffffff'], [17.5, 0.12, '#ff8a3a'], [18.7, 0.32, '#6a3a6a'], [19.8, 0.55, '#0b1838'], [24, 0.62, '#0b1838']];
    for (let i = 0; i < K.length - 1; i++) if (h >= K[i][0] && h <= K[i + 1][0]) {
      const q = (h - K[i][0]) / (K[i + 1][0] - K[i][0]);
      return { a: lerp(K[i][1], K[i + 1][1], q), c: mix(K[i][2], K[i + 1][2], q) };
    }
    return { a: 0, c: '#ffffff' };
  }
};

const FSHAPE = { start: [120, 34], end: [120, 34], process: [150, 40], io: [160, 40], decision: [170, 62] };
function fDim(n) { const [w, h] = FSHAPE[n.t]; const L = String(n.label || '').slice(0, 26).length * 12 + (n.t === 'decision' ? 70 : n.t === 'io' ? 44 : 28); return [Math.max(w, L), h]; }
const FCOL = { start: '#43a85a', end: '#43a85a', process: '#3f86d8', io: '#2fa6a0', decision: '#d9aa1c' };
const FNAME = { start: 'Start/End', end: 'End', process: 'Process', io: 'Input/Output', decision: 'Decision' };

function fShape(n, extra = '') {
  const [w, h] = fDim(n); const x = n.x - w / 2, y = n.y - h / 2, c = FCOL[n.t];
  let s;
  if (n.t === 'start' || n.t === 'end') s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="17" ry="17" fill="${c}" stroke="#1c2b24" stroke-width="3"/>`;
  else if (n.t === 'process') s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" stroke="#1c2b24" stroke-width="3"/>`;
  else if (n.t === 'io') s = `<polygon points="${x + 16},${y} ${x + w},${y} ${x + w - 16},${y + h} ${x},${y + h}" fill="${c}" stroke="#1c2b24" stroke-width="3"/>`;
  else s = `<polygon points="${n.x},${y} ${x + w},${n.y} ${n.x},${y + h} ${x},${n.y}" fill="${c}" stroke="#1c2b24" stroke-width="3"/>`;
  const label = String(n.label || '').slice(0, 26);
  return `<g class="fnode" data-k="${esc(n.k)}" ${extra}>${s}<text x="${n.x}" y="${n.y + 5}" text-anchor="middle" class="ftext">${esc(label)}</text></g>`;
}
function fPorts(n) {
  const [w, h] = fDim(n);

  if (n.t === 'decision') return [{ br: 'yes', x: n.x - w / 2, y: n.y }, { br: 'no', x: n.x + w / 2, y: n.y }];
  return [{ br: null, x: n.x, y: n.y + h / 2 }];
}
function fEdgePath(a, b, port) {
  const [bw, bh] = fDim(b);

  if (port.br === 'yes' || port.br === 'no') {

    if (ty > sy + 10) { const ox = sx + dir * 18; return `M${sx},${sy} L${ox},${sy} L${ox},${(ty - 14)} L${tx},${ty - 14} L${tx},${ty}`; }

const SVG_DEFS = `<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2b24"/></marker><marker id="arwy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f4f"/></marker><marker id="arwn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0403a"/></marker></defs>`;

// ---------- Flowchart → Python ----------
function negateCond(c) {

function flowToPy(nodes, edges) {

  const bfs = (from, stops) => { const order = [], seen = new Set(); const q = [from]; while (q.length) { const k = q.shift(); if (!k || seen.has(k) || stops.has(k)) continue; seen.add(k); order.push(k); for (const s of succ(k)) q.push(s); } return order; };

      if (n.t === 'decision') {

        if (nl && !yl) { emit(`while ${negateCond(cond)}:`, ind); gen(o.no, ind + 1, new Set([...stops, k])); k = o.yes; continue; }

// ---------- Validation ----------
function validateFlow(P, nodes, edges) {
  const by = {}; for (const n of nodes) by[n.k] = n;
  const L = k => by[k] ? `"${by[k].label}"` : k;
  const missing = P.nodes.filter(n => !by[n.k]);
  if (missing.length) return `Masih ada simbol yang belum dipakai: ${missing.map(n => '"' + n.label + '"').join(', ')}. Seret dari palet ke kanvas.`;
  for (const n of nodes) {
    const out = edges.filter(e => e.from === n.k);
    if (n.t === 'end') { if (out.length) return `END adalah akhir alur. Hapus panah yang keluar dari END.`; continue; }
    if (n.t === 'decision') {
      const y = out.find(e => e.br === 'yes'), no = out.find(e => e.br === 'no');
      if (!y || !no) return `Decision ${L(n.k)} harus punya DUA cabang: YES (port hijau, kiri) dan NO (port merah, kanan).`;
    } else if (!out.length) return `Simbol ${L(n.k)} belum punya panah keluar. Tarik panah dari titik di bawahnya.`;
  }

  const start = nodes.find(n => n.t === 'start');
  const seen = new Set(); const st = [start.k];
  while (st.length) { const k = st.pop(); if (seen.has(k)) continue; seen.add(k); for (const e of edges) if (e.from === k) st.push(e.to); }

  if (lost.length) return `Jalur terputus: ${lost.map(n => '"' + n.label + '"').join(', ')} tidak bisa dicapai dari START.`;
  // compare with expected
  const key = e => `${e[0]}>${e[1]}:${e[2] || ''}`;
  const want = new Set(P.edges.map(key));
  const have = new Set(edges.map(e => key([e.from, e.to, e.br])));
  for (const e of P.edges) {
    if (have.has(key(e))) continue;
    if (e[2]) { const swapped = [e[0], e[1], e[2] === 'yes' ? 'no' : 'yes']; if (have.has(key(swapped))) return `Cabang YES dan NO pada ${L(e[0])} tertukar. Pikirkan: jika kondisinya BENAR (YES), apa yang harus terjadi?`; }
    return `Alur setelah ${L(e[0])}${e[2] ? ' (cabang ' + e[2].toUpperCase() + ')' : ''} belum tepat. Periksa urutannya lagi.`;
  }
  for (const e of edges) if (!want.has(key([e.from, e.to, e.br]))) return `Ada panah yang tidak tepat dari ${L(e.from)} ke ${L(e.to)}.`;
  return null;
}

// ---------- Blocks → Flowchart view ----------
const FlowView = {
  fromBlocks(body) {
    const nodes = [], edges = []; let id = 0;
    const N = (t, label, x, y) => { const n = { k: 'v' + (id++), t, label, x, y }; nodes.push(n); return n; };
    const groups = list => { const g = []; for (const b of list) { if (b.type === 'end') continue; if ((b.type === 'elif' || b.type === 'else') && g.length && g[g.length - 1].chain && !g[g.length - 1].closed) { g[g.length - 1].parts.push(b); if (b.type === 'else') g[g.length - 1].closed = true; } else if (b.type === 'if') g.push({ chain: true, parts: [b] }); else g.push({ b }); } return g; };
    const BW = 190;
    const width = list => { let w = BW; for (const g of groups(list)) w = Math.max(w, gw(g)); return w; };
    const gw = g => { if (g.chain) { let w = 0; for (const p of g.parts) w += width(p.body || []); if (g.parts[g.parts.length - 1].type !== 'else') w += BW / 2; return w; } if (g.b.body) return width(g.b.body) + 60; return BW; };
    const label = b => { const ls = []; genStmt(Object.assign({}, b, { body: b.body ? [] : undefined }), 0, ls); return (ls[0] ? ls[0].text : b.type).replace(/:$/, ''); };
    const typ = b => b.type === 'print' || (b.type === 'setvar' && b.in.v.b && b.in.v.b.type === 'input') ? 'io' : 'process';
    // returns {exits:[{n, br}], y}
    const lay = (list, cx, y, prev) => {
      let exits = prev;
      for (const g of groups(list)) {
        const link = n => { for (const ex of exits) edges.push({ from: ex.n.k, to: n.k, br: ex.br || null }); };
        if (g.chain) {
          let colX = cx - gw(g) / 2, outExits = [], noExit = null, first = true;
          for (let i = 0; i < g.parts.length; i++) {
            const p = g.parts[i], w = width(p.body || []);
            const dy = y + i * 60;
            if (p.type === 'else') {
              const r = lay(p.body, colX + w / 2, y + (i - 1) * 60 + 90, noExit ? [noExit] : []);
              outExits = outExits.concat(r.exits); colX += w; noExit = null; continue;
            }
            const d = N('decision', label(p) + '?', i === 0 ? cx : colX + w / 2, dy);
            if (first) { link(d); first = false; } else if (noExit) edges.push({ from: noExit.n.k, to: d.k, br: 'no' });
            const r = lay(p.body, colX + w / 2, dy + 90, [{ n: d, br: 'yes' }]);
            outExits = outExits.concat(r.exits); noExit = { n: d, br: 'no' }; colX += w;
          }
          if (noExit) outExits.push(noExit);
          let maxY = y; for (const n of nodes) maxY = Math.max(maxY, n.y);
          exits = outExits; y = maxY + 90;
        } else if (g.b.body) {
          const d = N('decision', label(g.b) + '?', cx, y); link(d);
          const r = lay(g.b.body, cx, y + 90, [{ n: d, br: 'yes' }]);
          for (const ex of r.exits) edges.push({ from: ex.n.k, to: d.k, br: ex.br || null });
          let maxY = y; for (const n of nodes) maxY = Math.max(maxY, n.y);
          exits = [{ n: d, br: 'no' }]; y = maxY + 90;
        } else {
          const n = N(typ(g.b), label(g.b), cx, y); link(n); exits = [{ n }]; y += 70;
        }
      }
      return { exits, y };
    };
    const W = Math.max(380, width(body) + 120);
    const s = N('start', 'START', W / 2, 30);
    const r = lay(body, W / 2, 100, [{ n: s }]);
    const e = N('end', 'END', W / 2, r.y);
    for (const ex of r.exits) edges.push({ from: ex.n.k, to: e.k, br: ex.br || null });
    let minX = 1e9, maxX = 0; for (const n of nodes) { minX = Math.min(minX, n.x - fDim(n)[0] / 2 - 40); maxX = Math.max(maxX, n.x + fDim(n)[0] / 2 + 40); }
    const shift = minX < 0 ? -minX : 0; for (const n of nodes) n.x += shift;
    const Wf = Math.max(W, maxX + shift), Hf = r.y + 50;
    const by = {}; for (const n of nodes) by[n.k] = n;
    let out = `<svg class="fsvg view" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wf} ${Hf}" width="${Wf}" height="${Hf}">${SVG_DEFS}`;
    for (const ed of edges) { const a = by[ed.from], b = by[ed.to]; const port = fPorts(a).find(p => p.br === ed.br) || fPorts(a)[0]; if (!port) continue; out += `<path d="${fEdgePath(a, b, port)}" class="fedge" stroke="${ed.br === 'yes' ? '#2f8f4f' : ed.br === 'no' ? '#c0403a' : '#1c2b24'}" marker-end="url(#${ed.br === 'yes' ? 'arwy' : ed.br === 'no' ? 'arwn' : 'arw'})"/>`; if (ed.br) out += `<text x="${port.x + (ed.br === 'yes' ? -26 : 8)}" y="${port.y - 6}" class="fbr ${ed.br}">${ed.br === 'yes' ? 'YES' : 'NO'}</text>`; }
    for (const n of nodes) out += fShape(n);
    return out + '</svg>';
  }
};
